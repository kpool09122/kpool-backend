openapi: 3.0.0
info:
  title: k-pool Site Management API
  version: 0.0.0
tags: []
paths:
  /contact/principals/{principalIdentifier}:
    get:
      operationId: ContactOperations_listContactsByPrincipal
      description: List contact inquiries for the specified principal. Requires a site-management administrator.
      parameters:
        - name: principalIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.Uuid'
      responses:
        '200':
          description: Response containing contact inquiries for an principal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyContactSummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /contact/principals/{principalIdentifier}/{contactIdentifier}:
    get:
      operationId: ContactOperations_getContactDetail
      description: Get the specified contact inquiry for an principal. Requires a site-management administrator.
      parameters:
        - name: principalIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.Uuid'
        - name: contactIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.Uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /contact/submit:
    post:
      operationId: ContactOperations_submitContact
      description: Submit a contact inquiry.
      parameters: []
      responses:
        '201':
          description: Response returned when a contact inquiry is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSummary'
        '419':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitContactRequestBody'
  /contacts:
    get:
      operationId: ContactListOperations_listContacts
      description: List all contact inquiries, optionally filtered by principal. Requires a site-management administrator.
      parameters:
        - name: principalIdentifier
          in: query
          required: false
          schema:
            type: string
            allOf:
              - $ref: '#/components/schemas/KPool.Common.Uuid'
            nullable: true
          explode: false
        - name: hasReply
          in: query
          required: false
          description: 'Reply-status filter: 1 for at least one successfully sent reply, 0 for none. When omitted (null), no reply-status filter is applied.'
          schema:
            type: string
            enum:
              - '0'
              - '1'
            nullable: true
          explode: false
        - name: perPage
          in: query
          required: false
          description: Maximum number of inquiries per page (1-100, default 50).
          schema:
            type: integer
            format: int32
            nullable: true
            minimum: 1
            maximum: 100
          explode: false
        - name: page
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
            format: int32
            nullable: true
            minimum: 1
          explode: false
      responses:
        '200':
          description: Response containing contact inquiries and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContactsPage'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /contacts/{contactIdentifier}/replies:
    post:
      operationId: ContactListOperations_replyContact
      description: Send a reply to a contact inquiry. Requires a site-management administrator. Returns no payload; mail delivery failures retain failed reply history and return 500.
      parameters:
        - name: contactIdentifier
          in: path
          required: true
          description: UUIDv7 contact identifier, matching the existing ContactIdentifier domain constraint.
          schema:
            $ref: '#/components/schemas/KPool.Common.UuidV7'
      responses:
        '204':
          description: Response with no content.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '419':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyContactRequestBody'
      security:
        - SessionCookieAuth: []
  /my/contact:
    get:
      operationId: MyContactOperations_listMyContacts
      description: List contact inquiries associated with the signed-in principal, newest first.
      parameters: []
      responses:
        '200':
          description: Response containing contact inquiries associated with the signed-in principal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyContactSummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /my/contact/{contactIdentifier}:
    get:
      operationId: MyContactOperations_getMyContactDetail
      description: Get a contact inquiry associated with the signed-in principal.
      parameters:
        - name: contactIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.Uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
components:
  schemas:
    ContactCategory:
      type: number
      enum:
        - 1
        - 2
        - 3
        - 99
      description: Contact category accepted by the submit-contact endpoint.
    ContactDetail:
      type: object
      required:
        - contactIdentifier
        - category
        - name
        - createdAt
        - content
        - replies
      properties:
        contactIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        principalIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
        category:
          type: integer
          format: int32
        name:
          type: string
        createdAt:
          $ref: '#/components/schemas/KPool.Common.Timestamp'
        content:
          type: string
        replies:
          type: array
          items:
            $ref: '#/components/schemas/ContactReplyDetail'
      description: Contact inquiry detail.
    ContactReplyDetail:
      type: object
      required:
        - replyIdentifier
        - content
        - sentAt
      properties:
        replyIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        content:
          type: string
        sentAt:
          $ref: '#/components/schemas/KPool.Common.Timestamp'
      description: A successfully sent reply to a contact inquiry.
    ContactSummary:
      type: object
      required:
        - contactIdentifier
        - category
        - name
        - email
        - content
      properties:
        contactIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Contact identifier.
        principalIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Site-management principal identifier when the inquiry is associated with a signed-in user.
        category:
          type: integer
          format: int32
          description: Category of the inquiry.
        name:
          type: string
          description: Name of the person submitting the inquiry.
        email:
          type: string
          description: Email address of the person submitting the inquiry.
        content:
          type: string
          description: Inquiry details.
      description: Submitted contact snapshot returned after creation.
    KPool.Common.ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        title:
          type: string
          description: Short error title.
        detail:
          type: string
          description: Human-readable error detail.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          description: Machine-readable application error code. Authenticated endpoints use authentication_required for a missing or invalid login session, and recent_authentication_required when the current identity and login session lack valid recent authentication. Both return 401; clients must use this code rather than matching detail text.
      description: RFC 9457 Problem Details payload shared by JSON error responses.
    KPool.Common.Timestamp:
      type: string
      description: Timestamp in ISO 8601 format.
    KPool.Common.Uuid:
      type: string
      format: uuid
      description: UUID identifier.
    KPool.Common.UuidV7:
      type: string
      format: uuid
      description: UUIDv7 identifier.
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    ListContactsPage:
      type: object
      required:
        - contacts
        - current_page
        - last_page
        - total
        - per_page
      properties:
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/MyContactSummary'
          description: Contact inquiries on the requested page.
        current_page:
          type: integer
          format: int32
          description: Current page number.
        last_page:
          type: integer
          format: int32
          description: Last available page number.
        total:
          type: integer
          format: int32
          description: Total number of matching inquiries.
        per_page:
          type: integer
          format: int32
          description: Number of inquiries per page.
      description: Paginated contact inquiries and page metadata.
    MyContactSummary:
      type: object
      required:
        - contactIdentifier
        - category
        - name
        - replyIdentifiers
        - createdAt
      properties:
        contactIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Contact identifier.
        principalIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Site-management principal identifier associated with the inquiry.
        category:
          type: integer
          format: int32
          description: Category of the inquiry.
        name:
          type: string
          description: Name of the person submitting the inquiry.
        replyIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Identifiers of replies sent successfully for this inquiry.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          description: Timestamp when the inquiry was created.
      description: Contact inquiry summary returned to its submitter.
    ReplyContactRequestBody:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          description: Non-empty reply content. No maximum length is imposed by ReplyContent.
      description: Request body for replying to a contact inquiry.
    SubmitContactRequestBody:
      type: object
      required:
        - category
        - name
        - email
        - content
      properties:
        category:
          allOf:
            - $ref: '#/components/schemas/ContactCategory'
          description: Category of the inquiry.
        name:
          type: string
          description: Name of the person submitting the inquiry.
        email:
          type: string
          description: Email address of the person submitting the inquiry.
        content:
          type: string
          description: Inquiry details.
      description: Request body for submitting a contact inquiry.
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: k-pool_session
      description: 'Authenticated Laravel session cookie. Obtain it through the login flow and retain it for authenticated requests. Session API mutations also require CSRF protection: initialize it with GET /api/v1/identity/auth/csrf-token and send the URL-decoded XSRF-TOKEN cookie value in X-XSRF-TOKEN.'
servers:
  - url: /api/v1/site-management
    description: Laravel route prefix from bootstrap/app.php.
    variables: {}
