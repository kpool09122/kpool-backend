  /principal-groups/members:
    patch:
      operationId: PrincipalGroupOperations_updatePrincipalGroupMembers
      description: Atomically save specified group memberships and Principal statuses while preserving omitted groups and statuses. The final combined state must retain a reachable active permission manager; an active replacement and suspension of the old manager can be saved together. Duplicate status identifiers return 422; missing or out-of-scope Principals return 404; insufficient permission or protected Operator groups return 403. An unchanged forced_stop is accepted. A forbidden status change returns 409 code principal_status_change_forbidden; losing the last active manager returns 409 code last_active_manager. Both roll back the entire save. Success returns only the submitted groups and Principal statuses; clients refetch management lists separately. Status restrictions take effect on the next request even for logged-in cached sessions.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePrincipalGroupMembersResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.PrincipalStatusConflictProblem'
        '419':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrincipalGroupMembersRequestBody'
      security:
        - SessionCookieAuth: []
components:
  schemas:
    AnnouncementCategory:
      type: number
      enum:
        - 1
        - 2
        - 3
      description: Category shared by all language contents of an announcement.
    AnnouncementContents:
      type: object
      properties:
        ja:
          $ref: '#/components/schemas/AnnouncementLocalizedContent'
        ko:
          $ref: '#/components/schemas/AnnouncementLocalizedContent'
        en:
          $ref: '#/components/schemas/AnnouncementLocalizedContent'
      description: Available contents by language. Untranslated languages are omitted. The source language is always present.
    AnnouncementLocalizedContent:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 2048
    ContactCategory:
      type: number
      enum:
        - 1
        - 2
        - 3
        - 99
      description: Contact category accepted by the submit-contact endpoint.
    ContactDetail:
      type: object
      required:
        - contactIdentifier
        - category
        - name
        - createdAt
        - content
        - replies
      properties:
        contactIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        principalIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
        category:
          type: integer
          format: int32
        name:
          type: string
        createdAt:
          $ref: '#/components/schemas/KPool.Common.Timestamp'
        content:
          type: string
        replies:
          type: array
          items:
            $ref: '#/components/schemas/ContactReplyDetail'
      description: Contact inquiry detail.
    ContactReplyDetail:
      type: object
      required:
        - replyIdentifier
        - content
        - sentAt
      properties:
        replyIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        content:
          type: string
        sentAt:
          $ref: '#/components/schemas/KPool.Common.Timestamp'
      description: A successfully sent reply to a contact inquiry.
    ContactSummary:
      type: object
      required:
        - contactIdentifier
        - category
        - name
        - email
        - content
      properties:
        contactIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Contact identifier.
        principalIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Site-management principal identifier when the inquiry is associated with a signed-in user.
        category:
          type: integer
          format: int32
          description: Category of the inquiry.
        name:
          type: string
          description: Name of the person submitting the inquiry.
        email:
          type: string
          description: Email address of the person submitting the inquiry.
        content:
          type: string
          description: Inquiry details.
      description: Submitted contact snapshot returned after creation.
    CreateAnnouncementRequestBody:
      type: object
      required:
        - language
        - category
        - title
        - content
      properties:
        language:
          type: string
          enum:
            - ja
            - ko
            - en
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        title:
          type: string
          minLength: 1
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 2048
      description: Create one draft with original content in language. sourceLanguage is set to this language. Publication date is assigned by the server when published.
    DeleteAnnouncementResponse:
      type: object
      required:
        - announcements
      properties:
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/DraftAnnouncement'
          maxItems: 1
      description: The deleted draft, or an empty array if no draft existed. Published announcements are retained.
    DraftAnnouncement:
      type: object
      required:
        - announcementIdentifier
        - sourceLanguage
        - category
        - contents
      properties:
        announcementIdentifier:
          $ref: '#/components/schemas/KPool.Common.UuidV7'
        sourceLanguage:
          type: string
          enum:
            - ja
            - ko
            - en
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        contents:
          $ref: '#/components/schemas/AnnouncementContents'
      description: One draft announcement with shared metadata and all available language contents. Incomplete translations are included for Operator review.
    KPool.Common.DateString:
      type: string
      description: ISO 8601 date string.
    KPool.Common.PrincipalStatus:
      type: string
      enum:
        - active
        - suspended
        - forced_stop
      description: Lifecycle of a context-specific Principal, independent of Account status. Only active authorizes protected operations. A forced_stop is set operationally, not through user permission management.
    KPool.Common.PrincipalStatusConflictProblem:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - last_active_manager
            - principal_status_change_forbidden
          description: 'last_active_manager: the final state loses the last reachable active permission manager. principal_status_change_forbidden: a forced-stop lifecycle transition was requested.'
      allOf:
        - $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      description: Atomic Principal membership/status save rejected. No submitted group or Principal change is committed.
    KPool.Common.PrincipalStatusUpdate:
      type: object
      required:
        - principalIdentifier
        - status
      properties:
        principalIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        status:
          $ref: '#/components/schemas/KPool.Common.PrincipalStatus'
      description: A Principal status in a bulk save or its successful result. Omitted Principals are unchanged. Duplicate identifiers are rejected. An unchanged forced_stop is accepted, but a change from forced_stop or a new forced_stop is forbidden.
    KPool.Common.ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        title:
          type: string
          description: Short error title.
        detail:
          type: string
          description: Human-readable error detail.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          description: Machine-readable application error code. Authenticated endpoints use authentication_required for a missing or invalid login session, and recent_authentication_required when the current identity and login session lack valid recent authentication. Both return 401; clients must use this code rather than matching detail text. A non-active Principal returns 403 with principal_inactive, distinct from ordinary permission denial. Bulk Principal membership/status saves return 409 with last_active_manager if the final state leaves no reachable active permission manager, or principal_status_change_forbidden if a forbidden lifecycle transition is requested. Neither conflict commits any membership or status changes.
      description: RFC 9457 Problem Details payload shared by JSON error responses.
    KPool.Common.Timestamp:
      type: string
      description: Timestamp in ISO 8601 format.
    KPool.Common.Uuid:
      type: string
      format: uuid
      description: UUID identifier.
    KPool.Common.UuidV7:
      type: string
      format: uuid
      description: UUIDv7 identifier.
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    ListAnnouncementsPage:
      type: object
      required:
        - announcements
        - current_page
        - last_page
        - total
        - per_page
      properties:
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/PublishedAnnouncementSummary'
        current_page:
          type: integer
          format: int32
          minimum: 1
        last_page:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int32
          minimum: 0
        per_page:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
    ListContactsPage:
      type: object
      required:
        - contacts
        - current_page
        - last_page
        - total
        - per_page
      properties:
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/MyContactSummary'
          description: Contact inquiries on the requested page.
        current_page:
          type: integer
          format: int32
          description: Current page number.
        last_page:
          type: integer
          format: int32
          description: Last available page number.
        total:
          type: integer
          format: int32
          description: Total number of matching inquiries.
        per_page:
          type: integer
          format: int32
          description: Number of inquiries per page.
      description: Paginated contact inquiries and page metadata.
    ListDraftAnnouncementsPage:
      type: object
      required:
        - announcements
        - current_page
        - last_page
        - total
        - per_page
      properties:
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/DraftAnnouncement'
        current_page:
          type: integer
          format: int32
          minimum: 1
        last_page:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int32
          minimum: 0
        per_page:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
    MyContactSummary:
      type: object
      required:
        - contactIdentifier
        - category
        - name
        - replyIdentifiers
        - createdAt
        - content
      properties:
        contactIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Contact identifier.
        principalIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Site-management principal identifier associated with the inquiry.
        category:
          type: integer
          format: int32
          description: Category of the inquiry.
        name:
          type: string
          description: Name of the person submitting the inquiry.
        replyIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Identifiers of replies sent successfully for this inquiry.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          description: Timestamp when the inquiry was created.
        content:
          type: string
          description: Full inquiry content.
      description: Contact inquiry summary returned to its submitter.
    PrincipalGroup:
      type: object
      required:
        - principalGroupIdentifier
        - accountIdentifier
        - name
        - description
        - roleIdentifiers
        - isDefault
        - members
      properties:
        principalGroupIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        accountIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        name:
          type: string
        description:
          type: string
          nullable: true
        roleIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/KPool.Common.Uuid'
        isDefault:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/PrincipalGroupMember'
      description: Editable group. Groups containing the system Operator role, including mixed-role groups, are excluded.
    PrincipalGroupList:
      type: object
      required:
        - principalGroups
        - principals
      properties:
        principalGroups:
          type: array
          items:
            $ref: '#/components/schemas/PrincipalGroup'
        principals:
          type: array
          items:
            $ref: '#/components/schemas/PrincipalGroupMember'
    PrincipalGroupMember:
      type: object
      required:
        - status
        - principalIdentifier
        - identityIdentifier
        - identityName
        - email
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.PrincipalStatus'
          description: Principal lifecycle status. Stopped users remain in management lists and retain their permissions.
        principalIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        identityIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        identityName:
          type: string
        email:
          type: string
      description: User information for a principal in the current Account, including users with no group memberships.
    PublishAnnouncementResponse:
      type: object
      required:
        - announcements
      properties:
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/PublishedAnnouncement'
          minItems: 1
          maxItems: 1
    PublishedAnnouncement:
      type: object
      required:
        - announcementIdentifier
        - sourceLanguage
        - category
        - contents
        - publishedDate
      properties:
        announcementIdentifier:
          $ref: '#/components/schemas/KPool.Common.UuidV7'
        sourceLanguage:
          type: string
          enum:
            - ja
            - ko
            - en
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        contents:
          $ref: '#/components/schemas/PublishedAnnouncementContents'
        publishedDate:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.DateString'
          format: date
    PublishedAnnouncementContents:
      type: object
      required:
        - ja
        - ko
        - en
      properties:
        ja:
          $ref: '#/components/schemas/AnnouncementLocalizedContent'
        ko:
          $ref: '#/components/schemas/AnnouncementLocalizedContent'
        en:
          $ref: '#/components/schemas/AnnouncementLocalizedContent'
    PublishedAnnouncementSummary:
      type: object
      required:
        - announcement_id
        - category_name
        - title
        - content
        - published_date
