        title:
          type: string
          minLength: 1
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 2048
      description: Replace common category and the selected language's content on an existing draft. Other language contents and sourceLanguage are retained. Titles and bodies must not be blank.
    UpdatePrincipalGroupMembersItem:
