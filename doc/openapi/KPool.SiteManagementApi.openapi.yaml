          items:
            $ref: '#/components/schemas/KPool.Common.PrincipalStatusUpdate'
          description: Statuses to save atomically with group memberships. Omission or an empty array makes no status changes; omitted Principals retain their status. All three values are accepted so unchanged forced_stop rows can be included.
    UpdatePrincipalGroupMembersResponse:
      type: object
      required:
        - principalGroups
        - principalStatuses
      properties:
        principalGroups:
          type: array
          items:
            $ref: '#/components/schemas/UpdatedPrincipalGroup'
        principalStatuses:
          type: array
          items:
            $ref: '#/components/schemas/KPool.Common.PrincipalStatusUpdate'
    UpdatedPrincipalGroup:
      type: object
      required:
        - principalGroupIdentifier
        - accountIdentifier
        - name
        - description
        - isDefault
        - memberCount
      properties:
        principalGroupIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        accountIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        name:
          type: string
        description:
          type: string
          nullable: true
        isDefault:
          type: boolean
        memberCount:
          type: integer
          format: int32
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: k-pool_session
      description: 'Authenticated Laravel session cookie. Obtain it through the login flow and retain it for authenticated requests. Session API mutations also require CSRF protection: initialize it with GET /api/v1/identity/auth/csrf-token and send the URL-decoded XSRF-TOKEN cookie value in X-XSRF-TOKEN.'
servers:
  - url: /api/v1/site-management
    description: Laravel route prefix from bootstrap/app.php.
    variables: {}
