openapi: 3.0.0
info:
  title: k-pool Site Management API
  version: 0.0.0
tags: []
paths:
  /announcements:
    get:
      operationId: AnnouncementOperations_listAnnouncements
      description: List published announcements without authentication. Filter by the requested language before pagination; drafts and unavailable translations are excluded. When language is omitted or null, resolve ja/ko/en from Accept-Language, falling back to English. Laravel resolves the page query automatically.
      parameters:
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum:
              - ja
              - ko
              - en
            nullable: true
          explode: false
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
        - name: perPage
          in: query
          required: false
          description: Number per page; default 50.
          schema:
            type: integer
            format: int32
            nullable: true
            minimum: 1
            maximum: 100
          explode: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            nullable: true
            minimum: 1
          explode: false
        - name: order
          in: query
          required: false
          description: Default desc.
          schema:
            type: string
            enum:
              - asc
              - desc
            nullable: true
          explode: false
        - name: sort
          in: query
          required: false
          description: Default published_date.
          schema:
            type: string
            enum:
              - published_date
              - title
            nullable: true
          explode: false
        - name: searchWords
          in: query
          required: false
          description: Literal substring of title or body in the selected language.
          schema:
            type: string
            nullable: true
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAnnouncementsPage'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /announcements/{announcementIdentifier}:
    get:
      operationId: AnnouncementOperations_getAnnouncement
      description: Get a published announcement without authentication in the selected language. When language is omitted or null, resolve Accept-Language with an English fallback. A missing announcement, a draft-only identifier or an unavailable translation returns 404.
      parameters:
        - name: announcementIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.UuidV7'
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum:
              - ja
              - ko
              - en
            nullable: true
          explode: false
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedAnnouncementSummary'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /contact/principals/{principalIdentifier}:
    get:
      operationId: ContactOperations_listContactsByPrincipal
      description: List contact inquiries for the specified principal. Requires a site-management Operator.
      parameters:
        - name: principalIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.Uuid'
      responses:
        '200':
          description: Response containing contact inquiries for an principal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyContactSummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /contact/principals/{principalIdentifier}/{contactIdentifier}:
    get:
      operationId: ContactOperations_getContactDetail
      description: Get the specified contact inquiry for an principal. Requires a site-management Operator.
      parameters:
        - name: principalIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.Uuid'
        - name: contactIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.Uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /contact/submit:
    post:
      operationId: ContactOperations_submitContact
      description: Submit a contact inquiry.
      parameters: []
      responses:
        '201':
          description: Response returned when a contact inquiry is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSummary'
        '419':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitContactRequestBody'
  /contacts:
    get:
      operationId: ContactListOperations_listContacts
      description: List all contact inquiries, optionally filtered by principal. Requires a site-management Operator.
      parameters:
        - name: principalIdentifier
          in: query
          required: false
          schema:
            type: string
            allOf:
              - $ref: '#/components/schemas/KPool.Common.Uuid'
            nullable: true
          explode: false
        - name: hasReply
          in: query
          required: false
          description: 'Reply-status filter: 1 for at least one successfully sent reply, 0 for none. When omitted (null), no reply-status filter is applied.'
          schema:
            type: string
            enum:
              - '0'
              - '1'
            nullable: true
          explode: false
        - name: perPage
          in: query
          required: false
          description: Maximum number of inquiries per page (1-100, default 50).
          schema:
            type: integer
            format: int32
            nullable: true
            minimum: 1
            maximum: 100
          explode: false
        - name: page
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
            format: int32
            nullable: true
            minimum: 1
          explode: false
      responses:
        '200':
          description: Response containing contact inquiries and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContactsPage'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /contacts/{contactIdentifier}/replies:
    post:
      operationId: ContactListOperations_replyContact
      description: Send a reply to a contact inquiry. Requires a site-management Operator. Returns no payload; mail delivery failures retain failed reply history and return 500.
      parameters:
        - name: contactIdentifier
          in: path
          required: true
          description: UUIDv7 contact identifier, matching the existing ContactIdentifier domain constraint.
          schema:
            $ref: '#/components/schemas/KPool.Common.UuidV7'
      responses:
        '204':
          description: Response with no content.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '419':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyContactRequestBody'
      security:
        - SessionCookieAuth: []
  /draft-announcements:
    get:
      operationId: DraftAnnouncementOperations_listDraftAnnouncements
      description: List draft announcements, including untranslated drafts, with all available language contents. Requires announcement:view-draft on announcement, granted to the system Operator role. General and Administrator alone are denied. The acting principal is resolved from the session; no principal or Account identifier is accepted as a selector. Search matches titles and bodies across available languages. Laravel resolves the page query automatically. Matching drafts are ordered by the selected field and then by identifier for stable pagination.
      parameters:
        - name: perPage
          in: query
          required: false
          description: Number of drafts per page; default 50.
          schema:
            type: integer
            format: int32
            nullable: true
            minimum: 1
            maximum: 100
          explode: false
        - name: page
          in: query
          required: false
          description: Laravel's standard current-page parameter; default 1.
          schema:
            type: integer
            format: int32
            nullable: true
            minimum: 1
          explode: false
        - name: order
          in: query
          required: false
          description: Sort direction; default desc.
          schema:
            type: string
            enum:
              - asc
              - desc
            nullable: true
          explode: false
        - name: sort
          in: query
          required: false
          description: Sort field; default created_at.
          schema:
            type: string
            enum:
              - created_at
            nullable: true
          explode: false
        - name: searchWords
          in: query
          required: false
          description: Literal substring to find in any available language title or body. Empty or null disables filtering.
          schema:
            type: string
            nullable: true
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDraftAnnouncementsPage'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      security:
        - SessionCookieAuth: []
    post:
      operationId: DraftAnnouncementCommandOperations_createAnnouncement
      description: Create a draft. Requires announcement:create on announcement. Acting principal is resolved from the session. Returns one draft with its generated identifier.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftAnnouncement'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '419':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequestBody'
      security:
        - SessionCookieAuth: []
  /draft-announcements/{announcementIdentifier}:
    get:
      operationId: DraftAnnouncementOperations_getDraftAnnouncement
      description: Get a draft announcement with all available language contents. Requires announcement:view-draft on announcement, granted to the system Operator role. Authorization is checked before reading the draft. A missing or deleted draft, including an identifier that exists only as a published announcement, returns 404. Invalid identifiers return 422.
      parameters:
        - name: announcementIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.UuidV7'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftAnnouncement'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      security:
        - SessionCookieAuth: []
    put:
      operationId: DraftAnnouncementCommandOperations_updateAnnouncement
      description: Update an existing draft's common metadata and selected language content. Requires announcement:update on announcement. A missing draft returns 404.
      parameters:
        - name: announcementIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.UuidV7'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftAnnouncement'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '419':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
