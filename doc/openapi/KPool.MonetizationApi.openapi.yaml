      description: List the current effective Account's groups in created-at/identifier order, including Owners and Default groups. Members and roles are ordered by identifier and scoped to the Account (system roles are included). Requires active Account/Account Principal/Monetization Principal and principal_group_manage permission. No arbitrary Account or Principal selection is accepted. Does not create authorization data. Empty collections are arrays.
