        name:
          type: string
        status:
          type: string
        phone:
          type: string
        countryCode:
          type: string
        administrativeAreaCode:
          type: string
          nullable: true
        postalCode:
          type: string
        locality:
          type: string
          nullable: true
        addressLine1:
