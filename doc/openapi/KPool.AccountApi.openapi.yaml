    KPool.Common.PrincipalStatus:
      type: string
      enum:
        - active
        - suspended
        - forced_stop
      description: Lifecycle of a context-specific Principal, independent of Account status. Only active authorizes protected operations. A forced_stop is set operationally, not through user permission management.
    KPool.Common.PrincipalStatusConflictProblem:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - last_active_manager
            - principal_status_change_forbidden
          description: 'last_active_manager: the final state loses the last reachable active permission manager. principal_status_change_forbidden: a forced-stop lifecycle transition was requested.'
      allOf:
        - $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      description: Atomic Principal membership/status save rejected. No submitted group or Principal change is committed.
    KPool.Common.PrincipalStatusUpdate:
      type: object
      required:
        - principalIdentifier
        - status
      properties:
        principalIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        status:
          $ref: '#/components/schemas/KPool.Common.PrincipalStatus'
      description: A Principal status in a bulk save or its successful result. Omitted Principals are unchanged. Duplicate identifiers are rejected. An unchanged forced_stop is accepted, but a change from forced_stop or a new forced_stop is forbidden.
    KPool.Common.ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        title:
          type: string
          description: Short error title.
        detail:
          type: string
          description: Human-readable error detail.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          description: 'Machine-readable application error code. Internal API Bearer errors: 401 authentication_required for malformed, expired, revoked, wrong-audience tokens or a missing Identity; 403 insufficient_scope for a missing route scope; 403 oauth_route_not_allowed for non-allowlisted method/route pairs. Internal API token configuration failures return 500, not 401. Cookie-only mutations can return 419 csrf_token_mismatch. Authenticated endpoints use authentication_required for a missing or invalid login session, and recent_authentication_required when the current identity and login session lack valid recent authentication. Both return 401; clients must use this code rather than matching detail text. A non-active Principal returns 403 with principal_inactive, distinct from ordinary permission denial. Bulk Principal membership/status saves return 409 with last_active_manager if the final state leaves no reachable active permission manager, or principal_status_change_forbidden if a forbidden lifecycle transition is requested. Neither conflict commits any membership or status changes.'
      description: RFC 9457 Problem Details payload shared by JSON error responses.
    KPool.Common.Timestamp:
      type: string
      description: Timestamp in ISO 8601 format.
    KPool.Common.Uuid:
      type: string
      format: uuid
      description: UUID identifier.
