components:
  schemas:
    AccountCategoryChangeRequestDetailResponseBody:
      type: object
      required:
        - request
        - account
        - documents
      properties:
        request:
          allOf:
            - $ref: '#/components/schemas/AccountCategoryChangeRequestSummary'
          description: Account category change request.
        account:
          allOf:
            - $ref: '#/components/schemas/AccountSummary'
          description: Account information captured when the request was submitted.
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AccountDocumentSummary'
          description: Independent copies of the documents captured when the request was submitted.
      description: Response body for account category change request detail.
    AccountCategoryChangeRequestListItemSummary:
      type: object
      required:
        - snapshotIdentifier
        - requestIdentifier
        - accountIdentifier
        - currentAccountCategory
        - requestedAccountCategory
        - status
        - requestedAt
        - account
      properties:
        snapshotIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Approved snapshot fixed at application time; approval records refer to this same snapshot.
        requestIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Account category change request identifier.
        accountIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Target account identifier.
        currentAccountCategory:
          type: string
          description: Current account category.
        requestedAccountCategory:
          type: string
          description: Requested account category.
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - withdrawn
          description: Request status.
        requestedAt:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          description: Timestamp when the request was created.
        reviewedBy:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Reviewer account identifier.
        reviewedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          nullable: true
          description: Timestamp when the request was reviewed.
        rejectionReason:
          type: object
          allOf:
            - $ref: '#/components/schemas/VerificationRejectionReasonSummary'
          nullable: true
          description: Optional rejection reason.
        account:
          allOf:
            - $ref: '#/components/schemas/AccountSummary'
          description: Account information captured when the request was submitted.
      description: Account category change request state with target account summary.
    AccountCategoryChangeRequestSummary:
      type: object
      required:
        - snapshotIdentifier
        - requestIdentifier
        - accountIdentifier
        - currentAccountCategory
        - requestedAccountCategory
        - status
        - requestedAt
      properties:
        snapshotIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Approved snapshot fixed at application time; approval records refer to this same snapshot.
        requestIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Account category change request identifier.
        accountIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Target account identifier.
        currentAccountCategory:
          type: string
          description: Current account category.
        requestedAccountCategory:
          type: string
          description: Requested account category.
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - withdrawn
          description: Request status.
        requestedAt:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          description: Timestamp when the request was created.
        reviewedBy:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Reviewer account identifier.
        reviewedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          nullable: true
          description: Timestamp when the request was reviewed.
        rejectionReason:
          type: object
          allOf:
            - $ref: '#/components/schemas/VerificationRejectionReasonSummary'
          nullable: true
          description: Optional rejection reason.
      description: Account category change request state.
    AccountDocumentSummary:
      type: object
      required:
        - documentType
        - documentPath
        - uploadedAt
      properties:
        documentType:
          type: string
          description: Document type.
        documentPath:
          type: string
          description: Stored document path.
        uploadedAt:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          description: Timestamp when the document was uploaded.
      description: Uploaded account document state.
    AccountDocumentUploadItem:
      type: object
      required:
        - documentType
        - fileContents
      properties:
        documentType:
          type: string
          description: Document type.
        fileContents:
          type: string
          description: Base64-encoded document contents.
      description: Current account state.
    AccountMemberSummary:
      type: object
      required:
        - status
        - principalIdentifier
        - identityIdentifier
        - identityName
        - email
        - principalGroups
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.PrincipalStatus'
          description: Principal lifecycle status. Stopped users remain in management lists and retain their permissions.
        principalIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Principal identifier.
        identityIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Identity identifier.
        identityName:
          type: string
          description: Identity display name.
        email:
          type: string
          description: Identity email address.
        principalGroups:
          type: array
          items:
            $ref: '#/components/schemas/MemberPrincipalGroupSummary'
          description: Principal groups assigned to the member.
      description: Account member summary.
    AccountNotificationCandidate:
      type: object
      required:
        - identityIdentifier
        - name
        - email
        - language
      properties:
        identityIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        name:
          type: string
        email:
          type: string
        language:
          type: string
    AccountNotificationRecipient:
      type: object
      required:
        - identityIdentifier
        - channel
      properties:
        identityIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        channel:
          type: string
          enum:
            - email
      description: An account email notification recipient. Other channels are not currently supported.
    AccountNotificationSettings:
      type: object
      required:
        - recipients
        - candidates
        - maxRecipients
      properties:
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/AccountNotificationRecipient'
          description: Selected recipients still belonging to the account, ordered by Identity UUID.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/AccountNotificationCandidate'
          description: Current account members, ordered by Identity UUID. Recipients do not need account management permissions.
        maxRecipients:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
    AccountSnapshotChangeProposal:
      type: object
      required:
        - account
        - documents
      properties:
        account:
          $ref: '#/components/schemas/AccountSnapshotProfile'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AccountSnapshotDocument'
    AccountSnapshotChangeRequestDetail:
      type: object
      required:
        - request
        - original
        - proposal
      properties:
        request:
          $ref: '#/components/schemas/AccountSnapshotChangeRequestSummary'
        original:
          $ref: '#/components/schemas/AccountSnapshotDetail'
        proposal:
          $ref: '#/components/schemas/AccountSnapshotChangeProposal'
    AccountSnapshotChangeRequestSummary:
      type: object
      required:
        - requestIdentifier
        - accountIdentifier
        - snapshotIdentifier
        - reviewedSnapshotIdentifier
        - changeReason
        - status
        - requestedAt
        - reviewedBy
        - reviewedAt
        - rejectionReason
      properties:
        requestIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        accountIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        snapshotIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        reviewedSnapshotIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
        changeReason:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        requestedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: object
          properties:
            code:
              type: string
            detail:
              type: string
              nullable: true
          required:
            - code
            - detail
          nullable: true
      description: Independent snapshot-change review. Original snapshot and historic service/category application references never change. Approval and rejection both preserve a snapshot with the corresponding status; only approved snapshots can become current.
    AccountSnapshotDetail:
      type: object
      required:
        - isCurrent
        - account
        - documents
      properties:
        isCurrent:
          type: boolean
        account:
          $ref: '#/components/schemas/AccountSnapshotProfile'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AccountSnapshotDocument'
          description: Documents ordered by documentType. Storage paths and content hashes are never returned. Read files through the authorized snapshot-specific endpoint.
      allOf:
        - $ref: '#/components/schemas/AccountSnapshotSummary'
    AccountSnapshotDocument:
      type: object
      required:
        - documentType
        - uploadedAt
      properties:
        documentType:
          type: string
        uploadedAt:
          type: string
          format: date-time
    AccountSnapshotProfile:
