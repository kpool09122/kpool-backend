  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: k-pool_session
      description: 'Authenticated Laravel session cookie. Obtain it through the login flow and retain it for authenticated requests. Session API mutations also require CSRF protection: initialize it with GET /api/v1/identity/auth/csrf-token and send the URL-decoded XSRF-TOKEN cookie value in X-XSRF-TOKEN.'
    InternalApiBearerAuth:
      type: http
      scheme: Bearer
      description: Short-lived internal API Bearer token, minted server-side from verified MCP authorization. Never send the MCP access token directly to this API. Authorization takes precedence over cookies with no fallback. Each request verifies the token, then checks the method/route scope allowlist and existing business permissions. Verified Bearer does not use a session or CSRF token. Account selection helpers need no extra scope; unregistered routes, including auto-create, consent APIs and authentication management, reject Bearer (403 oauth_route_not_allowed).
servers:
  - url: /api/v1/account
    description: Laravel route prefix from bootstrap/app.php.
    variables: {}
