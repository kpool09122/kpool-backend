openapi: 3.0.0
info:
  title: k-pool Identity API
  version: 0.0.0
tags: []
paths:
  /auth/identities/{identityIdentifier}/profile:
    get:
      operationId: IdentityAuthOperations_getIdentityProfile
      description: Get profile fields for the requested identity. Any authenticated identity may fetch the profile.
      parameters:
        - name: identityIdentifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/KPool.Common.Uuid'
      responses:
        '200':
          description: Response returned when fetching a requested identity profile succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfileSummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /auth/login:
    post:
      operationId: IdentityAuthOperations_login
      description: Authenticate with email and password.
      parameters: []
      responses:
        '200':
          description: Response returned when email login succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginIdentitySummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestBody'
  /auth/logout:
    post:
      operationId: IdentityAuthOperations_logout
      description: Log out the current authenticated identity.
      parameters: []
      responses:
        '200':
          description: Response returned when an endpoint succeeds with an empty JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.EmptyJsonObject'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /auth/me:
    get:
      operationId: IdentityAuthOperations_getAuthenticatedIdentity
      description: Get the current authenticated identity.
      parameters: []
      responses:
        '200':
          description: Response returned when fetching the current authenticated identity succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedIdentitySummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /auth/passkeys:
    get:
      operationId: IdentityAuthOperations_listPasskeys
      description: List passkeys registered by the current authenticated identity.
      parameters: []
      responses:
        '200':
          description: Response returned when registered passkeys are listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyListResult'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /auth/passkeys/addition:
    post:
      operationId: IdentityAuthOperations_addPasskey
      description: Verify and register an additional passkey for the authenticated identity.
      parameters: []
      responses:
        '200':
          description: Response returned when an endpoint succeeds with an empty JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.EmptyJsonObject'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPasskeyRequestBody'
  /auth/passkeys/addition/options:
    post:
      operationId: IdentityAuthOperations_createPasskeyOptions
      description: Create WebAuthn registration options for adding a passkey to the authenticated identity.
      parameters: []
      responses:
        '200':
          description: Response returned when passkey registration options are created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegistrationOptionsResult'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /auth/passkeys/authentication:
    post:
      operationId: IdentityAuthOperations_authenticateWithPasskey
      description: Verify a WebAuthn assertion and establish an authenticated session.
      parameters: []
      responses:
        '200':
          description: Response returned when an identity operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateWithPasskeyRequestBody'
  /auth/passkeys/authentication/options:
    post:
      operationId: IdentityAuthOperations_createPasskeyAuthenticationOptions
      description: Create discoverable WebAuthn authentication options without requiring an email address.
      parameters: []
      responses:
        '200':
          description: Response returned when passkey authentication options are created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthenticationOptionsResult'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /auth/passkeys/registration/options:
    post:
      operationId: IdentityAuthOperations_createPasskeyRegistrationOptions
      description: Create WebAuthn registration options for a verified or invited email address.
      parameters: []
      responses:
        '200':
          description: Response returned when passkey registration options are created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegistrationOptionsResult'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePasskeyRegistrationOptionsRequestBody'
  /auth/register:
    post:
      operationId: IdentityAuthOperations_createIdentity
      description: Register a new identity.
      parameters: []
      responses:
        '201':
          description: Response returned when an identity is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySummary'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentityRequestBody'
  /auth/send-auth-code:
    post:
      operationId: IdentityAuthOperations_sendAuthCode
      description: Send an auth code to the specified email address.
      parameters: []
      responses:
        '200':
          description: Response returned when an endpoint succeeds with an empty JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.EmptyJsonObject'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAuthCodeRequestBody'
  /auth/social/{provider}/callback:
    get:
      operationId: IdentityAuthOperations_socialLoginCallback
      description: Handle the social login callback and return the client redirect URL.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: Response returned by social login endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectUrlResult'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /auth/social/{provider}/redirect:
    get:
      operationId: IdentityAuthOperations_socialLoginRedirect
      description: Create an OAuth redirect URL for the selected social provider.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: accountType
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: oneTimeToken
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            nullable: true
          explode: false
      responses:
        '200':
          description: Response returned by social login endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectUrlResult'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
  /auth/verify-email:
    post:
      operationId: IdentityAuthOperations_verifyEmail
      description: Verify an email address using the issued auth code.
      parameters: []
      responses:
        '200':
          description: Response returned when email verification succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResult'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestBody'
  /identities/me:
    patch:
      operationId: IdentityOperations_updateIdentity
      description: Update the current identity profile.
      parameters: []
      responses:
        '200':
          description: Response returned when an identity operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdentityRequestBody'
components:
  schemas:
    AccountEffectivePolicySummary:
      type: object
      required:
        - policyIdentifier
        - name
        - isSystemPolicy
        - statements
      properties:
        policyIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Policy identifier.
        name:
          type: string
          description: Policy name.
        isSystemPolicy:
          type: boolean
          description: Whether this is a system policy.
        statements:
          type: array
          items:
            $ref: '#/components/schemas/AccountPolicyStatement'
          description: Statements that define the effective policy.
      description: Effective account policy summary for the authenticated identity.
    AccountPolicyCondition:
      type: object
      properties:
        clauses:
          type: array
          items:
            $ref: '#/components/schemas/AccountPolicyConditionClause'
          description: List of condition clauses.
      description: Conditional constraints for an account policy statement.
    AccountPolicyConditionClause:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: Field name to evaluate.
        operator:
          type: string
          description: Operator used for the comparison.
        value:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
            - type: boolean
          description: Value to compare against.
      description: Single condition clause in an account policy.
    AccountPolicyStatement:
      type: object
      required:
        - effect
        - actions
        - resourceTypes
      properties:
        effect:
          type: string
          description: Whether the statement allows or denies the action.
        actions:
          type: array
          items:
            type: string
          description: Actions covered by this statement.
        resourceTypes:
          type: array
          items:
            type: string
          description: Resource types covered by this statement.
        condition:
          type: object
          allOf:
            - $ref: '#/components/schemas/AccountPolicyCondition'
          nullable: true
          description: Optional condition attached to the statement.
      description: Policy statement returned for account effective policies.
    AddPasskeyRequestBody:
      type: object
      required:
        - challengeKey
        - displayName
        - credential
      properties:
        challengeKey:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        displayName:
          type: string
          maxLength: 64
        credential:
          $ref: '#/components/schemas/PasskeyRegistrationCredential'
      description: Request body for completing registration of an additional passkey.
    AuthenticateWithPasskeyRequestBody:
      type: object
      required:
        - challengeKey
        - credential
      properties:
        challengeKey:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        credential:
          $ref: '#/components/schemas/PasskeyAuthenticationCredential'
      description: Request body for completing passkey authentication.
    AuthenticatedAccountAddressSummary:
      type: object
      properties:
        countryCode:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code.
        administrativeAreaCode:
          type: string
          nullable: true
          description: Administrative area code for supported countries.
        postalCode:
          type: string
          nullable: true
          description: Postal code.
        locality:
          type: string
          nullable: true
          description: Locality/city name.
        addressLine1:
          type: string
          nullable: true
          description: Primary address line.
        addressLine2:
          type: string
          nullable: true
          description: Secondary address line.
      description: Account contact address summary returned for authenticated account details.
    AuthenticatedAccountReferenceSummary:
      type: object
      required:
        - accountIdentifier
        - name
      properties:
        accountIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Account identifier.
        name:
          type: string
          description: Account display name.
      description: Account reference used by account switching controls.
    AuthenticatedAccountSummary:
      type: object
      required:
        - accountIdentifier
        - email
        - type
        - name
        - status
        - accountCategory
      properties:
        accountIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Account identifier.
        email:
          type: string
          description: Account email address.
        type:
          type: string
          description: Account type.
        name:
          type: string
          description: Account display name.
        status:
          type: string
          description: Account status.
        accountCategory:
          type: string
          description: Account category assigned during creation.
        phone:
          type: string
          nullable: true
          description: Contact phone number.
        address:
          type: object
          allOf:
            - $ref: '#/components/schemas/AuthenticatedAccountAddressSummary'
          nullable: true
          description: Contact address.
      description: Account summary returned for the authenticated identity.
    AuthenticatedIdentitySummary:
      type: object
      required:
        - accountIdentifier
        - accountPrincipalIdentifier
        - accountType
        - accountPolicies
        - originalAccount
        - delegationIdentifier
        - switchableAccounts
      properties:
        accountIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Account identifier associated with the authenticated identity.
        accountPrincipalIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Account principal identifier associated with the authenticated identity in the current account.
        accountType:
          type: string
          nullable: true
          description: Account type associated with the authenticated identity.
        accountPolicies:
          type: array
          items:
            $ref: '#/components/schemas/AccountEffectivePolicySummary'
          description: Effective policies for the authenticated identity in the current account.
        account:
          type: object
          allOf:
            - $ref: '#/components/schemas/AuthenticatedAccountSummary'
          nullable: true
          description: Detailed information for the currently effective account.
        originalAccount:
          type: object
          allOf:
            - $ref: '#/components/schemas/AuthenticatedAccountReferenceSummary'
          nullable: true
          description: Original account to return to when ending delegated account context.
        delegationIdentifier:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          nullable: true
          description: Delegation currently supplying the effective account context.
        switchableAccounts:
          type: array
          items:
            $ref: '#/components/schemas/SwitchableAccountSummary'
          description: Approved delegated accounts available from the original account.
      allOf:
        - $ref: '#/components/schemas/IdentitySummary'
      description: Authenticated identity summary returned for the current identity.
    CreateIdentityRequestBody:
      type: object
      required:
        - identityName
        - email
        - password
        - confirmedPassword
      properties:
        identityName:
          type: string
          description: Requested identityName.
        email:
          type: string
          description: Email address.
        password:
          type: string
          description: Plain text password.
        confirmedPassword:
          type: string
          description: Password confirmation.
        base64EncodedImage:
          type: string
          nullable: true
          description: Base64-encoded profile image.
        oneTimeToken:
          type: string
          nullable: true
          description: One-time token used during signup.
      description: Request body for registering a new identity.
    CreatePasskeyRegistrationOptionsRequestBody:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: Verified or invited email address.
        accountType:
          type: string
          nullable: true
          description: Account type retained for signup completion.
        oneTimeToken:
          type: string
          nullable: true
          description: Invitation token retained for signup completion.
        return_to:
          type: string
          nullable: true
          description: Application return path retained for signup completion.
      description: Request body for starting passkey registration.
    IdentityProfileSummary:
      type: object
      required:
        - identityIdentifier
        - identityName
        - language
      properties:
        identityIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Identity identifier.
        identityName:
          type: string
          description: IdentityName.
        language:
          type: string
          description: Language code associated with the identity.
        profileImage:
          type: string
          nullable: true
          description: Profile image URL.
      description: Public profile fields for a requested identity.
    IdentitySummary:
      type: object
      required:
        - identityIdentifier
        - identityName
        - email
        - language
      properties:
        identityIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Identity identifier.
        identityName:
          type: string
          description: IdentityName.
        email:
          type: string
          description: Email address.
        language:
          type: string
          description: Language code associated with the identity.
        profileImage:
          type: string
          nullable: true
          description: Profile image path.
      description: Identity summary returned after authentication-related operations.
    KPool.Common.EmptyJsonObject:
      type: object
      description: Empty JSON object returned by endpoints with no payload.
    KPool.Common.ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        title:
          type: string
          description: Short error title.
        detail:
          type: string
          description: Human-readable error detail.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
      description: RFC 9457 Problem Details payload shared by JSON error responses.
    KPool.Common.Timestamp:
      type: string
      description: Timestamp in ISO 8601 format.
    KPool.Common.Uuid:
      type: string
      format: uuid
      description: UUID identifier.
    LoginIdentitySummary:
      type: object
      properties:
        returnTo:
          type: string
          nullable: true
          description: Normalized application return path after login.
      allOf:
        - $ref: '#/components/schemas/IdentitySummary'
      description: Identity summary returned after email login.
    LoginRequestBody:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: Email address.
        password:
          type: string
          description: Plain text password.
        return_to:
          type: string
          nullable: true
          description: Application return path after login.
      description: Request body for logging in.
    PasskeyAuthenticationCredential:
      type: object
      required:
        - id
        - rawId
        - type
        - response
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum:
            - public-key
        response:
          $ref: '#/components/schemas/PasskeyAuthenticatorAssertionResponse'
        authenticatorAttachment:
          type: string
          nullable: true
        clientExtensionResults:
          type: object
          allOf:
            - $ref: '#/components/schemas/KPool.Common.EmptyJsonObject'
          nullable: true
    PasskeyAuthenticationOptions:
      type: object
      required:
        - challenge
        - timeout
        - rpId
        - allowCredentials
        - userVerification
      properties:
        challenge:
          type: string
        timeout:
          type: integer
          format: int32
        rpId:
          type: string
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyCredentialDescriptor'
        userVerification:
          type: string
      description: WebAuthn PublicKeyCredentialRequestOptions returned to the browser.
    PasskeyAuthenticationOptionsResult:
      type: object
      required:
        - challengeKey
        - options
      properties:
        challengeKey:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Key used to submit the authentication assertion.
        options:
          $ref: '#/components/schemas/PasskeyAuthenticationOptions'
      description: Result for starting passkey authentication.
    PasskeyAuthenticatorAssertionResponse:
      type: object
      required:
        - clientDataJSON
        - authenticatorData
        - signature
      properties:
        clientDataJSON:
          type: string
        authenticatorData:
          type: string
        signature:
          type: string
        userHandle:
          type: string
          nullable: true
    PasskeyAuthenticatorAttestationResponse:
      type: object
      required:
        - clientDataJSON
        - attestationObject
      properties:
        clientDataJSON:
          type: string
        attestationObject:
          type: string
        transports:
          type: array
          items:
            type: string
          nullable: true
    PasskeyAuthenticatorSelection:
      type: object
      required:
        - residentKey
        - userVerification
      properties:
        residentKey:
          type: string
        userVerification:
          type: string
        requireResidentKey:
          type: boolean
          nullable: true
    PasskeyCredentialDescriptor:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        transports:
          type: array
          items:
            type: string
          nullable: true
    PasskeyCredentialParameter:
      type: object
      required:
        - type
        - alg
      properties:
        type:
          type: string
        alg:
          type: integer
          format: int32
    PasskeyListResult:
      type: object
      required:
        - passkeys
      properties:
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeySummary'
      description: Registered passkeys belonging to the authenticated identity.
    PasskeyRegistrationCredential:
      type: object
      required:
        - id
        - rawId
        - type
        - response
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum:
            - public-key
        response:
          $ref: '#/components/schemas/PasskeyAuthenticatorAttestationResponse'
        authenticatorAttachment:
          type: string
          nullable: true
        clientExtensionResults:
          type: object
          allOf:
            - $ref: '#/components/schemas/KPool.Common.EmptyJsonObject'
          nullable: true
    PasskeyRegistrationOptions:
      type: object
      required:
        - rp
        - user
        - challenge
        - pubKeyCredParams
        - timeout
        - excludeCredentials
        - authenticatorSelection
        - attestation
      properties:
        rp:
          $ref: '#/components/schemas/PasskeyRelyingPartyEntity'
        user:
          $ref: '#/components/schemas/PasskeyUserEntity'
        challenge:
          type: string
        pubKeyCredParams:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyCredentialParameter'
        timeout:
          type: integer
          format: int32
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyCredentialDescriptor'
        authenticatorSelection:
          $ref: '#/components/schemas/PasskeyAuthenticatorSelection'
        attestation:
          type: string
      description: WebAuthn PublicKeyCredentialCreationOptions returned to the browser.
    PasskeyRegistrationOptionsResult:
      type: object
      required:
        - challengeKey
        - options
      properties:
        challengeKey:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Key used to submit the registration attestation.
        options:
          $ref: '#/components/schemas/PasskeyRegistrationOptions'
      description: Result for starting passkey registration.
    PasskeyRelyingPartyEntity:
      type: object
      required:
        - name
        - id
      properties:
        name:
          type: string
        id:
          type: string
    PasskeySummary:
      type: object
      required:
        - passkeyIdentifier
        - displayName
        - transports
        - backupEligible
        - backupState
        - lastUsedAt
        - createdAt
      properties:
        passkeyIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Application identifier for the registered passkey.
        displayName:
          type: string
          description: User-visible name for the passkey.
        transports:
          type: array
          items:
            type: string
          description: Authenticator transports reported at registration.
        backupEligible:
          type: boolean
          description: Whether the credential is eligible for backup and synchronization.
        backupState:
          type: boolean
          description: Whether the credential is currently backed up.
        lastUsedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          nullable: true
          description: Timestamp of the most recent successful authentication.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          description: Timestamp when the passkey was registered.
      description: Public metadata for a passkey registered by the authenticated identity.
    PasskeyUserEntity:
      type: object
      required:
        - name
        - id
        - displayName
      properties:
        name:
          type: string
        id:
          type: string
        displayName:
          type: string
    RedirectUrlResult:
      type: object
      required:
        - redirectUrl
      properties:
        redirectUrl:
          type: string
          description: Client redirect URL returned by the backend.
      description: Redirect URL payload used by social login endpoints.
    SendAuthCodeRequestBody:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: Email address that will receive the auth code.
      description: Request body for sending an auth code.
    SwitchableAccountSummary:
      type: object
      required:
        - delegationIdentifier
        - accountIdentifier
        - account
        - isCurrent
      properties:
        delegationIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Approved delegation identifier used by POST /accounts/switch.
        accountIdentifier:
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Uuid'
          description: Target account identifier.
        account:
          allOf:
            - $ref: '#/components/schemas/AuthenticatedAccountReferenceSummary'
          description: Target account information used for display.
        isCurrent:
          type: boolean
          description: Whether this delegation currently supplies the effective account context.
      description: Account that the authenticated identity can switch to through an approved delegation.
    UpdateIdentityRequestBody:
      type: object
      properties:
        identityName:
          type: string
          nullable: true
          description: Identity display name.
        language:
          type: string
          nullable: true
          description: Language code associated with the identity.
        base64EncodedImage:
          type: string
          nullable: true
          description: Base64-encoded profile image.
      description: Request body for updating an identity profile.
    VerifyEmailRequestBody:
      type: object
      required:
        - email
        - authCode
      properties:
        email:
          type: string
          description: Email address being verified.
        authCode:
          type: string
          description: Auth code delivered to the email address.
      description: Request body for verifying an auth code.
    VerifyEmailResult:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: Verified email address.
        verifiedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/KPool.Common.Timestamp'
          nullable: true
          description: Timestamp when the email was verified.
      description: Email verification result.
servers:
  - url: /api/identity
    description: Laravel route prefix from bootstrap/app.php.
    variables: {}
