openapi: 3.0.0
info:
  title: k-pool Analyze API
  version: 0.0.0
tags: []
paths:
  /app/daily-summary:
    get:
      operationId: AnalysisOperations_getAppDailySummaryReport
      description: 'Get all App metrics for an inclusive UTC period of at most one calendar year ending no later than UTC D-3. Stored historical periods have no age cutoff. Requires active Account/Account principal and enrolled active Analyze principal with analysis:view. General grants all analyses; explicit Deny wins. Authorization is re-evaluated on every request. Never returns individual viewer/actor identifiers. Invalid period: 400; invalid query format: 422.'
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDailySummaryReport'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      security:
        - SessionCookieAuth: []
  /principal/me:
    get:
      operationId: PrincipalOperations_getCurrentPrincipal
      description: Inspect the authenticated identity's Analyze principal in the current account, including suspended/forced-stop states. Returns 404 before Analyze enrollment. Returns the principal status and effective policies.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalSnapshot'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      security:
        - SessionCookieAuth: []
  /principals:
    post:
      operationId: PrincipalOperations_createPrincipal
      description: Enable Analyze for the authenticated identity and current account. No caller-supplied identity or account is accepted. Requires active direct account membership, joins the account's General group. General's default role allows viewing every analysis, including other owners' Wikis and ALL, but suspended/forced-stop principals, missing grants and explicit Deny are rejected. Duplicate enrollment returns 409 without restoring permissions. Authorization cleanup never deletes analysis data.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalSummary'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      security:
        - SessionCookieAuth: []
  /wiki/daily-summary:
    get:
      operationId: AnalysisOperations_getWikiDailySummaryReport
      description: Get all Wiki metrics under the App period/authorization rules, including other owners' Wikis. Omit both target identifiers for ALL; specify either Wiki or translation set, never both. language/country filter all Wiki metrics. country=unknown selects unknown; omitted/null selects all. Stored zero values are measured zero; no summary rows means not_collected, including complete empty imports. Import failures leave published measurements unchanged and are handled through error monitoring and period-specific command retries. Operations read histories independently of imports. Counts, time and viewer-days sum; actor counts are period-distinct Principals. Country unknown is null. Countries without summary/history rows are omitted; absence alone does not prove measured zero. Authorization is re-evaluated on every request.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
        - name: wikiIdentifier
          in: query
          required: false
          schema:
            type: string
            allOf:
              - $ref: '#/components/schemas/KPool.Common.Uuid'
            nullable: true
          explode: false
        - name: translationSetIdentifier
          in: query
          required: false
          schema:
            type: string
            allOf:
              - $ref: '#/components/schemas/KPool.Common.Uuid'
            nullable: true
          explode: false
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum:
              - ja
              - ko
              - en
            nullable: true
          explode: false
        - name: country
          in: query
          required: false
          schema:
            type: string
            nullable: true
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiDailySummaryReport'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      security:
        - SessionCookieAuth: []
components:
  schemas:
    AppDailySummaryReport:
      type: object
      required:
        - applicationUsers
        - registeredUsers
      properties:
        applicationUsers:
          allOf:
            - $ref: '#/components/schemas/MetricReport'
          description: Sum of independently acquired daily application users (person-days). No country projection.
        registeredUsers:
          allOf:
            - $ref: '#/components/schemas/MetricReport'
          description: Identity closing balance on the final selected day; never filtered by Wiki/language/country. No country projection.
    CountryMetric:
      type: object
      required:
        - country
        - value
        - denominator
        - quality
      properties:
        country:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        denominator:
          type: integer
          format: int64
          nullable: true
        quality:
          type: array
          items:
            type: string
        actorCount:
          type: string
          nullable: true
      description: World-map period aggregation, sorted by code with unknown first. Null country means unknown (empty string in storage). Country actor counts are distinct within that country; do not sum them for the global actor count.
    KPool.Common.PrincipalStatusConflictProblem:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - last_active_manager
            - principal_status_change_forbidden
          description: 'last_active_manager: the final state loses the last reachable active permission manager. principal_status_change_forbidden: a forced-stop lifecycle transition was requested.'
      allOf:
        - $ref: '#/components/schemas/KPool.Common.ProblemDetails'
      description: Atomic Principal membership/status save rejected. No submitted group or Principal change is committed.
    KPool.Common.ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        title:
          type: string
          description: Short error title.
        detail:
          type: string
          description: Human-readable error detail.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          description: Machine-readable application error code. Authenticated endpoints use authentication_required for a missing or invalid login session, and recent_authentication_required when the current identity and login session lack valid recent authentication. Both return 401; clients must use this code rather than matching detail text. A non-active Principal returns 403 with principal_inactive, distinct from ordinary permission denial. Bulk Principal membership/status saves return 409 with last_active_manager if the final state leaves no reachable active permission manager, or principal_status_change_forbidden if a forbidden lifecycle transition is requested. Neither conflict commits any membership or status changes.
      description: RFC 9457 Problem Details payload shared by JSON error responses.
    KPool.Common.Uuid:
      type: string
      format: uuid
      description: UUID identifier.
    MetricDay:
      type: object
      required:
        - day
        - availability
        - value
        - denominator
        - quality
        - updatedAt
      properties:
        day:
          type: string
          format: date
        availability:
          type: string
          enum:
            - measured
            - not_collected
            - missing
            - incomplete
        value:
          type: string
          nullable: true
        denominator:
          type: integer
          format: int64
          nullable: true
        quality:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          nullable: true
        actorCount:
          type: string
          nullable: true
      description: UTC day. Availability describes stored measurements, not import execution. not_collected means no summary rows in the selected scope; it does not distinguish an empty import from an uncollected day. missing means an expected metric/definition is absent; incomplete also marks partial summary definitions. Direct history uses measured zero when empty, incomplete for missing attribution and null updatedAt. Import errors are reported operationally and leave published values and updatedAt unchanged.
    MetricDefinition:
      type: object
      required:
        - source
        - metric
        - grain
        - version
      properties:
        source:
          type: string
        metric:
          type: string
        grain:
          type: string
        version:
          type: string
      description: Metric definition selected by the server; callers cannot mix sources or versions.
    MetricReport:
      type: object
      required:
        - definition
        - revision
        - days
        - total
        - denominator
        - actorCount
        - countries
      properties:
        definition:
          $ref: '#/components/schemas/MetricDefinition'
        revision:
          type: string
          nullable: true
        days:
          type: array
          items:
            $ref: '#/components/schemas/MetricDay'
        total:
          type: string
          nullable: true
          description: "Additive total except registeredUsers: final selected UTC day's Identity closing balance. Null is not zero. May be a partial known total: inspect all daily states/quality."
        denominator:
          type: integer
          format: int64
          nullable: true
        actorCount:
          type: string
          nullable: true
          description: Distinct operation Principals over the full selection, never a sum of daily/country actors. Null for other metrics or incomplete attribution.
        countries:
          type: array
          items:
            $ref: '#/components/schemas/CountryMetric'
    PolicyStatement:
      type: object
      required:
        - effect
        - actions
        - resourceTypes
      properties:
        effect:
          type: string
          enum:
            - allow
            - deny
        actions:
          type: array
          items:
            type: string
            enum:
              - analysis:view
        resourceTypes:
          type: array
          items:
            type: string
            enum:
              - analysis
    PolicySummary:
      type: object
      required:
        - policyIdentifier
        - name
        - statements
      properties:
        policyIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        name:
          type: string
        statements:
          type: array
          items:
            $ref: '#/components/schemas/PolicyStatement'
    PrincipalSnapshot:
      type: object
      required:
        - principalIdentifier
        - identityIdentifier
        - status
        - policies
      properties:
        principalIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        identityIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        status:
          type: string
          enum:
            - active
            - suspended
            - forced_stop
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicySummary'
    PrincipalSummary:
      type: object
      required:
        - principalIdentifier
        - identityIdentifier
      properties:
        principalIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
        identityIdentifier:
          $ref: '#/components/schemas/KPool.Common.Uuid'
      description: New Analyze principal for the authenticated identity in the current account.
    WikiDailySummaryReport:
      type: object
      required:
        - views
        - viewers
        - engagementTime
        - submissions
        - publications
      properties:
        views:
          $ref: '#/components/schemas/MetricReport'
        viewers:
          $ref: '#/components/schemas/MetricReport'
        engagementTime:
          $ref: '#/components/schemas/MetricReport'
        submissions:
          $ref: '#/components/schemas/MetricReport'
        publications:
          $ref: '#/components/schemas/MetricReport'
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: k-pool_session
      description: 'Authenticated Laravel session cookie. Obtain it through the login flow and retain it for authenticated requests. Session API mutations also require CSRF protection: initialize it with GET /api/v1/identity/auth/csrf-token and send the URL-decoded XSRF-TOKEN cookie value in X-XSRF-TOKEN.'
servers:
  - url: /api/v1/analyze
    description: Laravel route prefix from bootstrap/app.php.
    variables: {}
