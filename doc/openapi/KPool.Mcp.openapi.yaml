  /mcp:
    post:
      operationId: sendMessage
      description: 'Streamable HTTP JSON responses, with no server session or unsolicited SSE. Every request requires an MCP-audience Bearer; Cookie and internal-API tokens are not accepted. tools/call arguments are strictly validated: get_account_context takes {}, switch_account requires delegationIdentifier (UUID or null for original Account). Tool notifications never execute side effects. 401/insufficient_scope 403 carry WWW-Authenticate; other API 403/404/409/422/429 return isError=true with sanitized structuredContent.status/code/retryAfter. No automatic retries, redirects or user-supplied API URLs.'
      parameters:
        - name: Accept
          in: header
          required: true
          schema:
            type: string
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          schema:
