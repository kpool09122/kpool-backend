version: '3'

vars:
  PHPUNIT: ./vendor/bin/phpunit
  SLEEP_SECONDS: 5
  API_SERVICES: php nginx db redis mail
  TEST_SERVICES: testing_db testing_redis
  PHP_RUN: docker-compose run --rm --no-deps php
  PHP_RUN_TEST: docker-compose run --rm --no-deps -e DB_HOST=testing_db -e REDIS_HOST=testing_redis php
  PHP_EXEC: docker-compose exec php

tasks:
  container:build:
    desc: Build self-contained production image for Linux ARM64
    cmds:
      - docker build --platform linux/arm64 --target production -t {{.image | default "kpool-backend:production"}} .

  container:smoke:
    desc: Check production PHP extensions and absence of development dependencies
    env:
      PRODUCTION_IMAGE: '{{.image | default "kpool-backend:production"}}'
    cmds:
      - bash scripts/container/smoke.sh

  container:verify:
    desc: Test all production modes, read-only root and graceful shutdown with isolated disposable DB/Redis
    env:
      PRODUCTION_IMAGE: '{{.image | default "kpool-backend:production"}}'
    cmds:
      - python3 scripts/container/verify.py
      - python3 scripts/container/audit-layers.py

  container:run:
    desc: 'Run a production mode. Usage: task container:run envfile=/absolute/path/runtime.env -- php artisan schedule:run'
    requires:
      vars: [envfile]
    env:
      RUNTIME_ENV_FILE: '{{.envfile}}'
      PRODUCTION_IMAGE: '{{.image | default "kpool-backend:production"}}'
      API_PORT: '{{.port | default "18080"}}'
    cmds:
      - bash scripts/container/run.sh {{.CLI_ARGS}}

  infra:validate:
    desc: Validate all CloudFormation templates and foundation/runtime security contracts offline
    cmds:
      - bash scripts/cloudformation/validate.sh

  wait-for-db:
    desc: Wait for database to be ready
    cmds:
      - echo "Waiting for database to be ready..."
      - '{{if eq OS "windows"}}powershell -Command "Start-Sleep -Seconds {{.SLEEP_SECONDS}}"{{else}}sleep {{.SLEEP_SECONDS}}{{end}}'
    silent: true

  test:
    desc: "Run all PHPUnit tests (DB tests + non-DB tests). Usage: task test [filter=TestClassName] [keepdb=1]"
    cmds:
      - docker-compose up -d {{.TEST_SERVICES}}
      - task: wait-for-db
      - defer: '{{if not .keepdb}}docker-compose stop testing_db testing_redis && docker-compose rm -v -f testing_db testing_redis{{end}}'
      - '{{.PHP_RUN_TEST}} bash -c "{{.PHPUNIT}}{{if .filter}} --filter={{.filter}}{{end}} --coverage-html coverage-html"'

  test-no-db:
    desc: "Run PHPUnit tests excluding 'useDb' group. Usage: task test-no-db [filter=TestClassName]"
    cmds:
      - docker-compose stop testing_db 2>/dev/null || true
      - '{{.PHP_RUN}} bash -c "{{.PHPUNIT}}{{if .filter}} --filter={{.filter}}{{end}} --exclude-group useDb --coverage-html coverage-html"'

  check:
    desc: Run code style fix, static analysis, and all tests
    cmds:
      - task: cs-fix
      - task: phpstan
      - task: test

  up:
    desc: Start Laravel API server with nginx + php-fpm
    cmds:
      - docker-compose up -d {{.API_SERVICES}}
      - task: wait-for-db
      - '{{.PHP_RUN}} php artisan migrate --force'

  down:
    desc: Stop the API stack
    cmds:
      - docker-compose stop {{.API_SERVICES}}

  restart:
    desc: Restart the API stack
    cmds:
      - docker-compose restart {{.API_SERVICES}}

  logs:
    desc: View Laravel API server logs
    cmds:
      - docker-compose logs -f {{.API_SERVICES}}

  queue-work:
    desc: "Start local Redis worker. Usage: task queue-work [connection=redis] [queue=webhook,settlement,default] [once=1]"
    cmds:
      - docker-compose up -d php db redis mail
      - task: wait-for-db
      - '{{.PHP_EXEC}} php artisan queue:work {{.connection | default "redis"}} --queue={{.queue | default "webhook,settlement,default"}} --timeout=90 --tries=3 {{if (index . "once")}}--once{{end}}'

  queue-work-sqs:
    desc: "Run the #673 worker contract with injected SQS/ECS credentials; does not provision AWS"
    cmds:
      - '{{.PHP_RUN}} php artisan queue:work sqs --timeout=90 --tries=3 {{if (index . "once")}}--once{{end}}'

  wiki:process-role-promotion:
    desc: "Enqueue monthly promotion (Asia/Tokyo). Usage: task wiki:process-role-promotion [month=2026-02] [sync=1]"
    cmds:
      - '{{.PHP_RUN}} php artisan wiki:process-role-promotion {{if .month}}--month={{.month}}{{end}} {{if (index . "sync")}}--sync{{end}}'

  video-links:collect:
    desc: "Enqueue video collection; zero exit means enqueue, not processing completed"
    cmds:
      - '{{.PHP_RUN}} php artisan video-links:collect'

  shell:
    desc: Open a shell in the php container
    cmds:
      - '{{.PHP_EXEC}} bash'

  reset:
    desc: Stop the API stack and remove local Docker volumes
    cmds:
      - docker-compose down -v --remove-orphans

  curl:
    desc: "Call a Laravel API endpoint from the host network. Usage: task curl path=/api/identity/auth/send-auth-code method=POST data='{\"email\":\"foo@example.com\"}'"
    cmds:
      - 'curl -i -X {{.method | default "GET"}} "http://localhost:{{.APP_PORT | default "8080"}}{{.path}}"{{if .data}} -H "Content-Type: application/json" --data "{{.data}}"{{end}}'

  curl-from-docker:
    desc: "Call the API from another container on the shared Docker network. Usage: task curl-from-docker path=/api/identity/auth/send-auth-code method=POST data='{\"email\":\"foo@example.com\"}'"
    cmds:
      - 'docker run --rm --network kpool-network curlimages/curl:8.13.0 -i -X {{.method | default "GET"}} "http://nginx{{.path}}"{{if .data}} -H "Content-Type: application/json" --data "{{.data}}"{{end}}'

  install:
    desc: Install composer dependencies
    cmds:
      - '{{.PHP_RUN}} composer install'

  key-generate:
    desc: "Generate APP_KEY in .env (requires an APP_KEY= entry). Usage: task key-generate"
    cmds:
      - '{{.PHP_RUN}} php artisan key:generate'

  composer:
    desc: "Run Composer in the PHP container. Usage: task composer -- require vendor/package"
    cmds:
      - '{{.PHP_RUN}} composer {{.CLI_ARGS}}'

  openapi:
    desc: Install TypeSpec dependencies and generate OpenAPI specs
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run typespec:compile

  openapi-generate:
    desc: Generate OpenAPI specs from TypeSpec definitions
    cmds:
      - pnpm run typespec:compile

  phpstan:
    desc: Run PHPStan static analysis
    cmds:
      - '{{.PHP_RUN}} composer phpstan'

  cs-fix:
    desc: Fix code style using PHP CS Fixer
    cmds:
      - '{{.PHP_RUN}} composer cs-fix'

  process-due-transfers:
    desc: "Execute due transfer batch processing. Usage: task process-due-transfers [date=2024-02-10] [dry-run=1]"
    cmds:
      - docker-compose up -d db redis
      - task: wait-for-db
      - '{{.PHP_RUN}} php artisan settlement:process-due-transfers {{if .date}}--date={{.date}}{{end}} {{if (index . "dry-run")}}--dry-run{{end}}'

  operations:grant:
    desc: "Grant Operations permissions. Usage: task operations:grant email=admin@example.com"
    requires:
      vars: [email]
    env:
      OPERATIONS_EMAIL: '{{.email}}'
    cmds:
      - docker-compose up -d db redis
      - task: wait-for-db
      - '{{.PHP_RUN}} php artisan operations:grant "$OPERATIONS_EMAIL"'

  operations:revoke:
    desc: "Revoke Operations permissions. Usage: task operations:revoke email=admin@example.com"
    requires:
      vars: [email]
    env:
      OPERATIONS_EMAIL: '{{.email}}'
    cmds:
      - docker-compose up -d db redis
      - task: wait-for-db
      - '{{.PHP_RUN}} php artisan operations:revoke "$OPERATIONS_EMAIL"'

  wiki:administrator:grant:
    desc: "Grant Wiki Administrator permissions. Usage: task wiki:administrator:grant email=admin@example.com"
    requires:
      vars: [email]
    env:
      WIKI_ADMINISTRATOR_EMAIL: '{{.email}}'
    cmds:
      - docker-compose up -d db redis
      - task: wait-for-db
      - '{{.PHP_RUN}} php artisan wiki:administrator:grant "$WIKI_ADMINISTRATOR_EMAIL"'

  wiki:administrator:revoke:
    desc: "Revoke Wiki Administrator permissions. Usage: task wiki:administrator:revoke email=admin@example.com"
    requires:
      vars: [email]
    env:
      WIKI_ADMINISTRATOR_EMAIL: '{{.email}}'
    cmds:
      - docker-compose up -d db redis
      - task: wait-for-db
      - '{{.PHP_RUN}} php artisan wiki:administrator:revoke "$WIKI_ADMINISTRATOR_EMAIL"'

  migrate:
    desc: "Run database migrations on db. Usage: task migrate"
    cmds:
      - docker-compose up -d db
      - task: wait-for-db
      - '{{.PHP_RUN}} php artisan migrate --force'

  migrate-fresh:
    desc: "Drop all tables, run migrations, and seed the database. Usage: task migrate-fresh"
    cmds:
      - docker-compose up -d db
      - task: wait-for-db
      - '{{.PHP_RUN}} php artisan migrate:fresh --seed --force'

  seed:
    desc: "Run database seeders. Usage: task seed [class=Database\\\\Seeders\\\\WikiEditorSampleSeeder]"
    cmds:
      - docker-compose up -d db
      - task: wait-for-db
      - 'docker-compose run --rm --no-deps php php artisan migrate --force'
      - 'docker-compose run --rm --no-deps php php artisan db:seed{{if .class}} --class="{{.class}}"{{end}}'

  help:
    desc: Show available tasks
    cmds:
      - task --list

  cfn:install:
    desc: Install pinned CloudFormation validator (CFN_PYTHON=python3.13, CFN_VENV=/tmp/kpool-cfn-tools)
    cmds:
      - bash scripts/cloudformation/run.sh install

  cfn:lint:
    desc: Validate CloudFormation against ap-northeast-1 schemas without AWS credentials
    cmds:
      - bash scripts/cloudformation/run.sh lint

  cfn:test:
    desc: Check CloudFormation security, bootstrap, and cross-stack contracts offline
    cmds:
      - bash scripts/cloudformation/run.sh test

  cfn:check:
    desc: Run all CloudFormation static checks without AWS credentials
    cmds:
      - bash scripts/cloudformation/run.sh check
