name: Production release
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [backend, all, frontend]
        default: all
      frontend_ref:
        description: Frontend release tag, e.g. v1.0.0 (empty uses the backend tag)
        type: string
        default: ''
      mode:
        type: choice
        options: [deploy, redeploy, resume-worker, rollback-api, rollback-worker]
        default: deploy
      source_run:
        description: Recorded release run ID for replay/rollback (no latest ref resolution)
        type: string
      source_attempt:
        description: Immutable recorded attempt (rerun defaults to attempt 1)
        type: string
        default: '1'
      initial:
        description: Explicit first activation of BOTH zero-count services
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kpool-release-production
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      backend_sha: ${{ steps.plan.outputs.backend_sha }}
      frontend_sha: ${{ steps.plan.outputs.frontend_sha }}
      mode: ${{ steps.plan.outputs.mode }}
      release_id: ${{ steps.plan.outputs.release_id }}
    steps:
      - name: Require backend release tag before checkout or credentials
        run: |
          python3 - <<'PYCODE'
          import os, re
          if os.environ['GITHUB_REPOSITORY'] != 'kpool09122/kpool-backend' or not re.fullmatch(r'refs/tags/v[A-Za-z0-9][A-Za-z0-9._-]*', os.environ['GITHUB_REF']):
              raise ValueError('Production control workflow must run from a backend release tag')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify release tag workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'scripts/release')
          from github_source import verify_control
          verify_control(os.environ['GITHUB_REF'], os.environ['CONTROL_SHA'])
          PYCODE
      - name: Check production settings before builds
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_MODE: ${{ inputs.mode }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BACKEND_RELEASE_CONFIGURATION: ${{ vars.BACKEND_RELEASE_CONFIGURATION }}
          RDS_CA_PEM: ${{ vars.RDS_CA_PEM }}
          RDS_CA_SHA256: ${{ vars.RDS_CA_SHA256 }}
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: python3 -B scripts/release/settings.py
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_MODE: ${{ inputs.mode }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          INITIAL_ACTIVATION: ${{ inputs.initial }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
        run: python3 -B scripts/release/cli.py plan
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-plan-${{ github.run_attempt }}
          path: |
            release/plan.json
            release/manifest.json
            release/previous.json
            release/failure.json
          if-no-files-found: error
          retention-days: 90
      - if: always()
        run: python3 -B scripts/release/cli.py summary
  validate-build:
    needs: plan
    if: inputs.target != 'frontend' && needs.plan.outputs.mode == 'deploy'
    uses: ./.github/workflows/backend-validation.yml
    with:
      source_sha: ${{ needs.plan.outputs.backend_sha }}
      control_sha: ${{ github.workflow_sha }}
      plan_artifact: release-plan-${{ github.run_attempt }}
  publish:
    needs: [plan, validate-build, frontend-build]
    if: >-
      always() && !cancelled() && inputs.target != 'frontend' && needs.plan.result == 'success' &&
      needs.plan.outputs.mode == 'deploy' && needs.validate-build.result == 'success' &&
      ((inputs.target == 'all' && needs.frontend-build.result == 'success') ||
      (inputs.target == 'backend' && needs.frontend-build.result == 'skipped'))
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/backend-publication.yml
    with:
      control_sha: ${{ github.workflow_sha }}
      plan_artifact: release-plan-${{ github.run_attempt }}
      build_artifact: ${{ needs.validate-build.outputs.artifact_name }}
  deploy:
    needs: [plan, validate-build, publish]
    if: >-
      always() && !cancelled() && inputs.target != 'frontend' && needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'deploy' && needs.publish.result == 'success' && needs.validate-build.result == 'success') ||
      (needs.plan.outputs.mode != 'deploy' && needs.publish.result == 'skipped' && needs.validate-build.result == 'skipped'))
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/backend-deployment.yml
    with:
      control_sha: ${{ github.workflow_sha }}
      plan_artifact: release-plan-${{ github.run_attempt }}
      image_artifact: ${{ needs.publish.outputs.artifact_name }}
  frontend-build:
    needs: plan
    if: inputs.target != 'backend' && needs.plan.outputs.mode == 'deploy'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject untrusted workflow control before checkout or credentials
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          if (os.environ['GITHUB_REPOSITORY'] != 'kpool09122/kpool-backend'
              or not re.fullmatch(r'refs/tags/v[A-Za-z0-9][A-Za-z0-9._-]*', os.environ['GITHUB_REF'])
              or not re.fullmatch('[0-9a-f]{40}', os.environ['CONTROL_SHA'])):
              raise ValueError('Untrusted workflow control repository/ref/SHA')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-plan-${{ github.run_attempt }}
          path: release
      - name: Verify pinned source and workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.frontend_sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, 'control/scripts/release')
          from cli import validate_plan
          from contract import FRONTEND
          from frontend import validate_configuration
          from github_source import resolve_source
          plan = validate_plan(json.load(open('release/plan.json')))
          if plan['frontend_sha'] != os.environ['SOURCE_SHA'] or plan['workflow_sha'] != os.environ['CONTROL_SHA']:
              raise ValueError('Source/control SHA does not match immutable plan')
          validate_configuration(json.loads(os.environ['FRONTEND_RELEASE_CONFIGURATION']), plan)
          if resolve_source(FRONTEND, plan['frontend_sha']) != plan['frontend_sha']:
              raise ValueError('Frontend source does not match the pinned commit')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kpool09122/kpool-frontend
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Select exact approved source
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.frontend_sha }}
        run: bash control/scripts/release/select-source.sh source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: source/package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: source/package.json
          run_install: false
          cache: true
          cache_dependency_path: source/pnpm-lock.yaml
      - name: Install exact lockfile
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Prepare approved nonsecret Workers configuration
        env:
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
        run: python3 -B control/scripts/release/frontend.py prepare
      - name: Validate and build Workers without deployment credentials
        working-directory: source
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm lint
          pnpm test:unit
          pnpm workers:build --config wrangler.deploy.json
          pnpm workers:smoke
      - name: Record deployable artifact and checksums
        env:
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
        run: python3 -B control/scripts/release/frontend.py build-record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-build-${{ github.run_attempt }}
          path: |
            release/frontend-build.tar.gz
            release/frontend-build.json
          if-no-files-found: error
          retention-days: 14
  frontend-deploy:
    needs: [plan, frontend-build, deploy]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.frontend-build.result == 'success' &&
      ((inputs.target == 'all' && needs.deploy.result == 'success') ||
      (inputs.target == 'frontend' && needs.deploy.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject untrusted workflow control before checkout or credentials
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          if (os.environ['GITHUB_REPOSITORY'] != 'kpool09122/kpool-backend'
              or not re.fullmatch(r'refs/tags/v[A-Za-z0-9][A-Za-z0-9._-]*', os.environ['GITHUB_REF'])
              or not re.fullmatch('[0-9a-f]{40}', os.environ['CONTROL_SHA'])):
              raise ValueError('Untrusted workflow control repository/ref/SHA')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-plan-${{ github.run_attempt }}
          path: release
      - name: Verify pinned source and workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.frontend_sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, 'control/scripts/release')
          from cli import validate_plan
          from contract import FRONTEND
          from frontend import validate_configuration
          from github_source import resolve_source
          plan = validate_plan(json.load(open('release/plan.json')))
          if plan['frontend_sha'] != os.environ['SOURCE_SHA'] or plan['workflow_sha'] != os.environ['CONTROL_SHA']:
              raise ValueError('Source/control SHA does not match immutable plan')
          validate_configuration(json.loads(os.environ['FRONTEND_RELEASE_CONFIGURATION']), plan)
          if resolve_source(FRONTEND, plan['frontend_sha']) != plan['frontend_sha']:
              raise ValueError('Frontend source does not match the pinned commit')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kpool09122/kpool-frontend
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Select exact approved source
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.frontend_sha }}
        run: bash control/scripts/release/select-source.sh source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: source/package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: source/package.json
          run_install: false
          cache: true
          cache_dependency_path: source/pnpm-lock.yaml
      - name: Install exact lockfile
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Prepare approved nonsecret Workers configuration
        env:
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
        run: python3 -B control/scripts/release/frontend.py prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-build-${{ github.run_attempt }}
          path: release
      - name: Restore the verified build without rebuilding
        env:
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
        run: python3 -B control/scripts/release/frontend.py restore
      - name: Verify pre-created Cloudflare resources and signing Secret
        id: preflight
        env:
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -B control/scripts/release/frontend.py preflight
      - name: Deploy the verified Workers build
        id: worker
        working-directory: source
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KPOOL_WORKERS_DEPLOY_CONFIG: wrangler.deploy.json
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/release/wrangler-output.jsonl
        run: pnpm workers:deploy
      - name: Observe Worker version and public HTTPS after deployment
        if: always() && steps.preflight.outcome == 'success'
        env:
          FRONTEND_RELEASE_CONFIGURATION: ${{ vars.FRONTEND_RELEASE_CONFIGURATION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FRONTEND_DEPLOY_OUTCOME: ${{ steps.worker.outcome }}
        run: python3 -B control/scripts/release/frontend.py observe
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-record-${{ github.run_attempt }}
          path: |
            release/frontend-build.json
            release/frontend-before.json
            release/frontend-deployment.json
          if-no-files-found: warn
          retention-days: 90
  record:
    needs: [plan, validate-build, frontend-build, publish, deploy, frontend-deploy]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          mkdir -p release
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          safe = {key: value['result'] for key, value in results.items()}
          with open('release/results.json', 'w') as stream:
              json.dump({'target': os.environ['RELEASE_TARGET'], 'jobs': safe}, stream, indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Release jobs: ' + json.dumps(safe) + '\n')
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-result-${{ github.run_attempt }}
          path: release/results.json
          retention-days: 90
