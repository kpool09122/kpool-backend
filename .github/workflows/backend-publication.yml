name: Backend ECR publication
on:
  workflow_call:
    inputs:
      control_sha: {type: string, required: true}
      plan_artifact: {type: string, required: true}
      build_artifact: {type: string, required: true}
    outputs:
      artifact_name:
        value: ${{ jobs.publish.outputs.artifact_name }}
      image_digest:
        value: ${{ jobs.publish.outputs.image_digest }}
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      artifact_name: backend-image-${{ github.run_attempt }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Reject untrusted workflow control before checkout or credentials
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          EXPECTED_CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          if (os.environ['GITHUB_REPOSITORY'] != 'kpool09122/kpool-backend'
              or os.environ['GITHUB_REF'] != 'refs/heads/main'
              or not re.fullmatch('[0-9a-f]{40}', os.environ['CONTROL_SHA'])
              or os.environ['CONTROL_SHA'] != os.environ['EXPECTED_CONTROL_SHA']):
              raise ValueError('Untrusted workflow control SHA/repository/ref')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.control_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.plan_artifact }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.build_artifact }}
          path: release
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
      - id: publish
        env:
          RELEASE_CONFIGURATION: ${{ vars.BACKEND_RELEASE_CONFIGURATION }}
        run: python3 -B scripts/release/cli.py publish
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-image-${{ github.run_attempt }}
          path: |
            release/manifest.json
            release/failure.json
            release/publication/*.json
          if-no-files-found: warn
          retention-days: 90
