AWSTemplateFormatVersion: '2010-09-09'
Description: kpool production ECS, ALB, release boundary and observability (ap-northeast-1).
Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{2,23}'
    Default: kpool-production
  MailDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
    Description: SES sender domain; verify the output DKIM records and request production access.
  DatabaseSecretArn:
    Type: String
  DatabaseEndpoint:
    Type: String
  DatabaseName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB and tasks; enable task public IP for outbound HTTPS.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Isolated data subnets for the lifecycle hook and its EC2 endpoint.
  AppSecretArn:
    Type: String
  MigrationSecretArn:
    Type: String
  ImagesBucketArn:
    Type: String
  FilesBucketArn:
    Type: String
  DeadLetterQueueArn:
    Type: String
  QueueArn:
    Type: String
  ApiDomainName:
    Type: String
    AllowedPattern: '[a-zA-Z0-9.-]+'
  CertificateArn:
    Type: String
    Description: Existing ACM certificate in ap-northeast-1, or empty to create DNS-validated ACM certificate.
    Default: ''
  HostedZoneId:
    Type: String
    Description: Required when creating certificate. Public Route53 zone hosting ApiDomainName.
    Default: ''
  ApiPort:
    Type: Number
    MinValue: 1024
    MaxValue: 65535
    Default: 8080
  HealthCheckPath:
    Type: String
    AllowedPattern: /.*
    Default: /health
  ApiCpu:
    Type: String
    AllowedValues:
    - '512'
    - '1024'
    Default: '512'
  ApiMemory:
    Type: String
    AllowedValues:
    - '1024'
    - '2048'
    - '3072'
    - '4096'
    Default: '1024'
  WorkerCpu:
    Type: String
    AllowedValues:
    - '256'
    - '512'
    Default: '256'
  WorkerMemory:
    Type: String
    AllowedValues:
    - '512'
    - '1024'
    - '2048'
    Default: '512'
  ApiTaskDefinitionArn:
    Type: String
    Description: Current pipeline-owned release revision ARN; empty uses a never-started bootstrap definition.
    Default: ''
  WorkerTaskDefinitionArn:
    Type: String
    Description: Current pipeline-owned release revision ARN; empty uses a never-started bootstrap definition.
    Default: ''
  SchedulerTaskDefinitionArn:
    Type: String
    Description: Current pipeline-owned release revision ARN; empty uses a never-started bootstrap definition.
    Default: ''
  ApiDesiredCount:
    Type: Number
    MinValue: 0
    MaxValue: 10
    Default: 0
  WorkerDesiredCount:
    Type: Number
    MinValue: 0
    MaxValue: 10
    Default: 0
  SchedulerState:
    Type: String
    AllowedValues:
    - DISABLED
    - ENABLED
    Default: DISABLED
  ScheduleExpression:
    Type: String
    Default: cron(0 3 1 * ? *)
  PrimaryTargetGroup:
    Type: String
    AllowedValues:
    - Blue
    - Green
    Description: Current service primary target group; reconcile from ECS before infrastructure updates.
    Default: Blue
  ProductionTargetGroup:
    Type: String
    AllowedValues:
    - Blue
    - Green
    Description: Current production rule target with weight 1 (other 0). Only update when deployment is stable.
    Default: Blue
  TestTargetGroup:
    Type: String
    AllowedValues:
    - Blue
    - Green
    Description: Current test rule target with weight 1 (other 0).
    Default: Green
  HookArtifactBucket:
    Type: String
    Description: 'Reviewed immutable Lambda ZIP artifact supplied by #157; all three are required together.'
    Default: ''
  HookArtifactKey:
    Type: String
    Description: 'Reviewed immutable Lambda ZIP artifact supplied by #157; all three are required together.'
    Default: ''
  HookArtifactVersion:
    Type: String
    Description: 'Reviewed immutable Lambda ZIP artifact supplied by #157; all three are required together.'
    Default: ''
  ExternalCanaryAlarmName:
    Type: String
    Description: Optional existing external HTTPS monitoring alarm in ap-northeast-1.
    Default: ''
  ContainerInsights:
    Type: String
    AllowedValues: [enabled, disabled]
    Default: disabled
    Description: Optional paid ECS container metrics; basic ECS and ALB metrics remain available.
  NotificationEmail:
    Type: String
    AllowedPattern: '[^@]+@[^@]+'
  LogRetentionDays:
    Type: Number
    AllowedValues:
    - 7
    - 14
    - 30
    - 60
    - 90
    - 180
    - 365
    Default: 30
  AlarmPeriod:
    Type: Number
    AllowedValues:
    - 60
    - 120
    Default: 60
  AlarmEvaluationPeriods:
    Type: Number
    MinValue: 1
    MaxValue: 2
    Default: 2
  ErrorCountThreshold:
    Type: Number
    MinValue: 1
    Default: 5
  LatencyThresholdSeconds:
    Type: Number
    MinValue: 0.1
    Default: 2
  AlarmMissingData:
    Type: String
    AllowedValues:
    - notBreaching
    - breaching
    - missing
    Description: ALB emits sparse metrics; external continuous canary must detect no-traffic failures.
    Default: notBreaching
  AppSecretKmsKeyArn:
    Type: String
    Description: Optional customer KMS key for app secret only; empty for AWS-managed key.
    Default: ''
  MigrationSecretKmsKeyArn:
    Type: String
    Description: Optional customer KMS key for migration secret only.
    Default: ''
  ApplicationSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  CacheSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  CacheSecretArn:
    Type: String
    Description: Foundation password secret ARN, injected by the app execution role; never a literal password.
Conditions:
  HasMailDomain:
    Fn::Not:
    - Fn::Equals: [{Ref: MailDomainName}, '']
  HasApiRelease:
    Fn::Not:
    - Fn::Equals:
      - Ref: ApiTaskDefinitionArn
      - ''
  HasWorkerRelease:
    Fn::Not:
    - Fn::Equals:
      - Ref: WorkerTaskDefinitionArn
      - ''
  HasSchedulerRelease:
    Fn::Not:
    - Fn::Equals:
      - Ref: SchedulerTaskDefinitionArn
      - ''
  CreateCertificate:
    Fn::Equals:
    - Ref: CertificateArn
    - ''
  HasHook:
    Fn::And:
    - Fn::Not:
      - Fn::Equals:
        - Ref: HookArtifactBucket
        - ''
    - Fn::Not:
      - Fn::Equals:
        - Ref: HookArtifactKey
        - ''
    - Fn::Not:
      - Fn::Equals:
        - Ref: HookArtifactVersion
        - ''
  HasCanary:
    Fn::Not:
    - Fn::Equals:
      - Ref: ExternalCanaryAlarmName
      - ''
  PrimaryBlue:
    Fn::Equals:
    - Ref: PrimaryTargetGroup
    - Blue
  ProductionBlue:
    Fn::Equals:
    - Ref: ProductionTargetGroup
    - Blue
  TestBlue:
    Fn::Equals:
    - Ref: TestTargetGroup
    - Blue
  HasAppKms:
    Fn::Not:
    - Fn::Equals:
      - Ref: AppSecretKmsKeyArn
      - ''
  HasMigrationKms:
    Fn::Not:
    - Fn::Equals:
      - Ref: MigrationSecretKmsKeyArn
      - ''
Rules:
  TokyoOnly:
    Assertions:
    - Assert:
        Fn::Equals:
        - Ref: AWS::Region
        - ap-northeast-1
      AssertDescription: Deploy in ap-northeast-1 only.
  CertificateInput:
    RuleCondition:
      Fn::Equals:
      - Ref: CertificateArn
      - ''
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: HostedZoneId
          - ''
      AssertDescription: Certificate creation requires a public Route53 hosted zone.
  ApiActivation:
    RuleCondition:
      Fn::Not:
      - Fn::Equals:
        - Ref: ApiDesiredCount
        - '0'
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ApiTaskDefinitionArn
          - ''
      AssertDescription: Positive desired count requires a release revision and API deployment verification contracts.
  WorkerActivation:
    RuleCondition:
      Fn::Not:
      - Fn::Equals:
        - Ref: WorkerDesiredCount
        - '0'
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: WorkerTaskDefinitionArn
          - ''
      AssertDescription: Positive desired count requires a release revision and API deployment verification contracts.
  HookArtifactComplete:
    RuleCondition:
      Fn::Or:
      - Fn::Not:
        - Fn::Equals:
          - Ref: HookArtifactBucket
          - ''
      - Fn::Not:
        - Fn::Equals:
          - Ref: HookArtifactKey
          - ''
      - Fn::Not:
        - Fn::Equals:
          - Ref: HookArtifactVersion
          - ''
    Assertions:
    - Assert:
        Fn::And:
        - Fn::Not:
          - Fn::Equals:
            - Ref: HookArtifactBucket
            - ''
        - Fn::Not:
          - Fn::Equals:
            - Ref: HookArtifactKey
            - ''
        - Fn::Not:
          - Fn::Equals:
            - Ref: HookArtifactVersion
            - ''
      AssertDescription: Supply bucket, key and immutable object version together.
  SchedulerActivation:
    RuleCondition:
      Fn::Equals:
      - Ref: SchedulerState
      - ENABLED
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: SchedulerTaskDefinitionArn
          - ''
      AssertDescription: Enable only with an approved scheduler release task definition.
  ApiSize:
    RuleCondition:
      Fn::Equals:
      - Ref: ApiCpu
      - '1024'
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ApiMemory
          - '1024'
      AssertDescription: 1024 CPU requires at least 2048 MiB.
  WorkerSize:
    RuleCondition:
      Fn::Equals:
      - Ref: WorkerCpu
      - '512'
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: WorkerMemory
          - '512'
      AssertDescription: 512 CPU requires at least 1024 MiB.
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: {Ref: ProjectName}
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Expire untagged images after 14 days; keep
          tagged release digests for explicit retirement","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}}]}'
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: {Ref: ProjectName}
      ClusterSettings:
      - Name: containerInsights
        Value: {Ref: ContainerInsights}
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /kpool/${ProjectName}/api
      RetentionInDays: {Ref: LogRetentionDays}
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /kpool/${ProjectName}/worker
      RetentionInDays: {Ref: LogRetentionDays}
  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /kpool/${ProjectName}/migration
      RetentionInDays: {Ref: LogRetentionDays}
  SchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /kpool/${ProjectName}/scheduler
      RetentionInDays: {Ref: LogRetentionDays}
  HookLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /kpool/${ProjectName}/hook
      RetentionInDays: {Ref: LogRetentionDays}
  AppExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-app-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
      - PolicyName: ScopedAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
            Resource:
              Fn::GetAtt:
              - Repository
              - Arn
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::GetAtt:
              - ApiLogGroup
              - Arn
            - Fn::GetAtt:
              - WorkerLogGroup
              - Arn
            - Fn::GetAtt:
              - SchedulerLogGroup
              - Arn
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: {Ref: AppSecretArn}
          - Fn::If:
            - HasAppKms
            - Effect: Allow
              Action:
              - kms:Decrypt
              Resource: {Ref: AppSecretKmsKeyArn}
              Condition:
                StringEquals:
                  kms:ViaService:
                    Fn::Sub: secretsmanager.${AWS::Region}.amazonaws.com
            - Ref: AWS::NoValue
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: {Ref: CacheSecretArn}
  MigrationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-migration-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
      - PolicyName: ScopedAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
            Resource:
              Fn::GetAtt:
              - Repository
              - Arn
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::GetAtt:
              - MigrationLogGroup
              - Arn
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: {Ref: MigrationSecretArn}
          - Fn::If:
            - HasMigrationKms
            - Effect: Allow
              Action:
              - kms:Decrypt
              Resource: {Ref: MigrationSecretKmsKeyArn}
              Condition:
                StringEquals:
                  kms:ViaService:
                    Fn::Sub: secretsmanager.${AWS::Region}.amazonaws.com
            - Ref: AWS::NoValue
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-api-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
      - PolicyName: ScopedAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            Resource:
              Fn::Join:
              - ''
              - - Ref: ImagesBucketArn
                - /images/*
          - Effect: Allow
            Action: s3:PutObjectAcl
            Resource:
              Fn::Join:
              - ''
              - - Ref: ImagesBucketArn
                - /images/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            Resource:
              Fn::Join:
              - ''
              - - Ref: FilesBucketArn
                - /verification-documents/*
          - Effect: Allow
            Action: s3:PutObjectAcl
            Resource:
              Fn::Join:
              - ''
              - - Ref: FilesBucketArn
                - /verification-documents/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          # HeadObject needs bucket-level ListBucket to return 404 for missing documents.
          # A prefix condition would not match HeadObject, which has no prefix parameter.
          - Effect: Allow
            Action: s3:ListBucket
            Resource: {Ref: FilesBucketArn}
          - Effect: Allow
            Action:
            - sqs:SendMessage
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
            Resource: {Ref: QueueArn}
          - Fn::If:
            - HasMailDomain
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailDomainName}'
              Condition:
                StringLike:
                  ses:FromAddress: !Sub '*@${MailDomainName}'
            - Ref: AWS::NoValue
  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-worker-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
      - PolicyName: ScopedAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            Resource:
              Fn::Join:
              - ''
              - - Ref: ImagesBucketArn
                - /images/*
          - Effect: Allow
            Action: s3:PutObjectAcl
            Resource:
              Fn::Join:
              - ''
              - - Ref: ImagesBucketArn
                - /images/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Effect: Allow
            Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:ChangeMessageVisibility
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
            Resource: {Ref: QueueArn}
          - Fn::If:
            - HasMailDomain
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailDomainName}'
              Condition:
                StringLike:
                  ses:FromAddress: !Sub '*@${MailDomainName}'
            - Ref: AWS::NoValue
  MigrationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-migration-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
  DatabaseSetupLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/kpool/${ProjectName}/database-setup'
      RetentionInDays: {Ref: LogRetentionDays}
  DatabaseSetupExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-database-setup-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: ecs-tasks.amazonaws.com}
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: {Ref: AWS::AccountId}
            ArnLike:
              aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
      - PolicyName: DatabaseInitializationOnly
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: [{Ref: DatabaseSecretArn}, {Ref: AppSecretArn}, {Ref: MigrationSecretArn}]
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt DatabaseSetupLogGroup.Arn
          - Fn::If:
            - HasAppKms
            - Effect: Allow
              Action: kms:Decrypt
              Resource: {Ref: AppSecretKmsKeyArn}
            - Ref: AWS::NoValue
          - Fn::If:
            - HasMigrationKms
            - Effect: Allow
              Action: kms:Decrypt
              Resource: {Ref: MigrationSecretKmsKeyArn}
            - Ref: AWS::NoValue
  DatabaseSetupTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-database-setup'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt DatabaseSetupExecutionRole.Arn
      TaskRoleArn: !GetAtt MigrationTaskRole.Arn
      Volumes: [{Name: setup-tmp}]
      ContainerDefinitions:
      - Name: database-setup
        Image: public.ecr.aws/docker/library/postgres:18-alpine
        User: postgres
        Essential: true
        ReadonlyRootFilesystem: true
        StopTimeout: 120
        MountPoints: [{SourceVolume: setup-tmp, ContainerPath: /tmp, ReadOnly: false}]
        EntryPoint: [/bin/sh, -c]
        Command:
        - |
            set -eu
            wget -q -T 30 -O /tmp/rds-ca.pem https://truststore.pki.rds.amazonaws.com/ap-northeast-1/ap-northeast-1-bundle.pem || { echo 'CA download failed'; exit 1; }
            export PGSSLMODE=verify-full PGSSLROOTCERT=/tmp/rds-ca.pem PGCONNECT_TIMEOUT=10
            if ! psql --no-psqlrc --quiet --set=ON_ERROR_STOP=1 >/dev/null 2>/dev/null <<'SQL'
            \getenv app_password APP_DB_PASSWORD
            \getenv migration_password MIGRATION_DB_PASSWORD
            BEGIN;
            SELECT 'CREATE ROLE kpool_app LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='kpool_app') \gexec
            SELECT 'CREATE ROLE kpool_migration LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='kpool_migration') \gexec
            DO $$ BEGIN
              IF EXISTS (SELECT FROM pg_roles WHERE rolname IN ('kpool_app', 'kpool_migration')
                         AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls)) THEN
                RAISE EXCEPTION 'Existing database role has unexpected administrative privileges';
              END IF;
            END $$;
            SELECT format('ALTER ROLE kpool_app PASSWORD %L', :'app_password') \gexec
            SELECT format('ALTER ROLE kpool_migration PASSWORD %L', :'migration_password') \gexec
            GRANT kpool_migration TO CURRENT_USER;
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            REVOKE CREATE ON SCHEMA public FROM PUBLIC;
            ALTER SCHEMA public OWNER TO kpool_migration;
            SELECT format('GRANT CONNECT ON DATABASE %I TO kpool_app, kpool_migration', current_database()) \gexec
            GRANT USAGE ON SCHEMA public TO kpool_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO kpool_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO kpool_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE kpool_migration IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO kpool_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE kpool_migration IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO kpool_app;
            COMMIT;
            SQL
            then
              echo 'Database setup failed; check database connectivity and role ownership'; exit 1
            fi
            echo 'Database roles and privileges initialized'
        Environment:
        - {Name: PGHOST, Value: {Ref: DatabaseEndpoint}}
        - {Name: PGDATABASE, Value: {Ref: DatabaseName}}
        Secrets:
        - Name: PGUSER
