            - elasticloadbalancing:RegisterTargets
            - elasticloadbalancing:DeregisterTargets
            Resource:
            - Ref: BlueTargetGroup
            - Ref: GreenTargetGroup
  HookExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-hook-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ScopedAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::GetAtt:
              - HookLogGroup
              - Arn
          - Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeSubnets
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
            Resource: '*'
  LifecycleHook:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-deployment-hook
      Runtime: python3.13
      Architectures:
      - arm64
      Handler: !If [HasHook, handler.handler, index.handler]
      Role:
        Fn::GetAtt:
        - HookExecutionRole
        - Arn
      Timeout: 120
      MemorySize: 256
      Code:
        Fn::If:
        - HasHook
        - S3Bucket: {Ref: HookArtifactBucket}
          S3Key: {Ref: HookArtifactKey}
          S3ObjectVersion: {Ref: HookArtifactVersion}
        - ZipFile: |
            import http.client
            import os
            import socket
            import ssl
            import boto3
            from botocore.config import Config

            class PrivateHttpsConnection(http.client.HTTPSConnection):
                def __init__(self, host, address, port):
                    super().__init__(host, port, timeout=5, context=ssl.create_default_context())
                    self.address = address

                def connect(self):
                    transport = socket.create_connection((self.address, self.port), self.timeout)
                    try:
                        self.sock = self._context.wrap_socket(transport, server_hostname=self.host)
                    except Exception:
                        transport.close()
                        raise

            def handler(event, context):
                # Trust deployment-owned environment, never a URL supplied in the event.
                if event.get('lifecycleStage') != 'POST_TEST_TRAFFIC_SHIFT':
                    return {'hookStatus': 'FAILED'}
                try:
                    host = os.environ['API_HOST']
                    path = os.environ['HEALTH_PATH']
                    port = int(os.environ['TEST_PORT'])
                    if not path.startswith('/') or path.startswith('//') or '\r' in path or '\n' in path:
                        return {'hookStatus': 'FAILED'}
                    client = boto3.client('ec2', config=Config(
                        connect_timeout=5, read_timeout=5, retries={'total_max_attempts': 2}))
                    paginator = client.get_paginator('describe_network_interfaces')
                    filters = [
                        {'Name': 'vpc-id', 'Values': [os.environ['VPC_ID']]},
                        {'Name': 'description', 'Values': ['ELB ' + os.environ['ALB_ARN'].split('loadbalancer/', 1)[1]]},
                    ]
                    addresses = sorted({eni['PrivateIpAddress']
                        for page in paginator.paginate(Filters=filters)
                        for eni in page['NetworkInterfaces']})
                    if not addresses:
                        return {'hookStatus': 'FAILED'}
                    for address in addresses:
                        connection = PrivateHttpsConnection(host, address, port)
                        try:
                            connection.request('GET', path, headers={'Host': host})
                            response = connection.getresponse()
                            if response.status != 200:
                                return {'hookStatus': 'FAILED'}
                            response.read(4096)
                        finally:
                            connection.close()
                    return {'hookStatus': 'SUCCEEDED'}
                except Exception:
                    # Responses and exception text can contain application data.
                    print('Deployment health verification failed')
                    return {'hookStatus': 'FAILED'}
      VpcConfig:
        SubnetIds: {Ref: PrivateSubnetIds}
        SecurityGroupIds:
        - Ref: HookSecurityGroup
      LoggingConfig:
        LogGroup: {Ref: HookLogGroup}
      Environment:
        Variables:
          ALB_ARN: {Ref: LoadBalancer}
          ALB_DNS_NAME:
            Fn::GetAtt:
            - LoadBalancer
            - DNSName
          API_HOST: {Ref: ApiDomainName}
          TEST_PORT: '8443'
          HEALTH_PATH: {Ref: HealthCheckPath}
          VPC_ID: {Ref: VpcId}
  HookInvocationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-hook-invocation
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ScopedAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
              - LifecycleHook
              - Arn
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${ProjectName}-runtime-alarms
      Subscription:
      - Protocol: email
        Endpoint: {Ref: NotificationEmail}
  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-unhealthy-targets'
      AlarmDescription: Notify when either API target group has persistently unhealthy targets.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions: [{Ref: AlarmTopic}]
      Metrics:
      - Id: unhealthy
        Expression: MAX([blue,green])
        ReturnData: true
      - Id: blue
        ReturnData: false
        MetricStat:
          Period: 60
          Stat: Maximum
          Metric:
            Namespace: AWS/ApplicationELB
            MetricName: UnHealthyHostCount
            Dimensions:
            - Name: LoadBalancer
              Value: !GetAtt LoadBalancer.LoadBalancerFullName
            - Name: TargetGroup
              Value: !GetAtt BlueTargetGroup.TargetGroupFullName
      - Id: green
        ReturnData: false
        MetricStat:
          Period: 60
          Stat: Maximum
          Metric:
            Namespace: AWS/ApplicationELB
            MetricName: UnHealthyHostCount
            Dimensions:
            - Name: LoadBalancer
              Value: !GetAtt LoadBalancer.LoadBalancerFullName
            - Name: TargetGroup
              Value: !GetAtt GreenTargetGroup.TargetGroupFullName
  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasMailDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: {Ref: MailDomainName}
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-5xx'
      AlarmDescription: Deployment rollback signal; external canary covers sparse/no traffic.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - LoadBalancer
          - LoadBalancerFullName
      Statistic: Sum
      Period: {Ref: AlarmPeriod}
      EvaluationPeriods: {Ref: AlarmEvaluationPeriods}
      Threshold: {Ref: ErrorCountThreshold}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: {Ref: AlarmMissingData}
      AlarmActions:
      - Ref: AlarmTopic
  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-latency'
      AlarmDescription: Deployment rollback signal; external canary covers sparse/no traffic.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::GetAtt:
          - LoadBalancer
          - LoadBalancerFullName
      Statistic: Average
      Period: {Ref: AlarmPeriod}
      EvaluationPeriods: {Ref: AlarmEvaluationPeriods}
      Threshold: {Ref: LatencyThresholdSeconds}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: {Ref: AlarmMissingData}
      AlarmActions:
      - Ref: AlarmTopic
  ApiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName:
        Fn::Sub: ${ProjectName}-api
      Cluster: {Ref: Cluster}
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      DesiredCount: {Ref: ApiDesiredCount}
      EnableExecuteCommand: false
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        Strategy: BLUE_GREEN
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        BakeTimeInMinutes: 5
        Alarms:
          Enable: true
          Rollback: true
          AlarmNames:
          - Ref: ServerErrorAlarm
          - Ref: LatencyAlarm
          - Fn::If:
            - HasCanary
            - Ref: ExternalCanaryAlarmName
            - Ref: AWS::NoValue
        LifecycleHooks:
        - HookTargetArn: !GetAtt LifecycleHook.Arn
          RoleArn: !GetAtt HookInvocationRole.Arn
          LifecycleStages: [POST_TEST_TRAFFIC_SHIFT]
          HookDetails:
            contractVersion: '1'
            expectedHost: {Ref: ApiDomainName}
            testPort: 8443
            healthPath: {Ref: HealthCheckPath}
      TaskDefinition:
        Fn::If:
        - HasApiRelease
        - Ref: ApiTaskDefinitionArn
        - Ref: ApiBootstrapTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: {Ref: PublicSubnetIds}
          SecurityGroups:
          - Ref: ApiSecurityGroup
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 60
      LoadBalancers:
      - ContainerName: api
        ContainerPort: {Ref: ApiPort}
        TargetGroupArn:
          Fn::If:
          - PrimaryBlue
          - Ref: BlueTargetGroup
          - Ref: GreenTargetGroup
        AdvancedConfiguration:
          AlternateTargetGroupArn:
            Fn::If:
            - PrimaryBlue
            - Ref: GreenTargetGroup
            - Ref: BlueTargetGroup
          ProductionListenerRule: {Ref: ProductionRule}
          TestListenerRule: {Ref: TestRule}
          RoleArn:
            Fn::GetAtt:
            - AlbInfrastructureRole
            - Arn
  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName:
        Fn::Sub: ${ProjectName}-worker
      Cluster: {Ref: Cluster}
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      DesiredCount: {Ref: WorkerDesiredCount}
      EnableExecuteCommand: false
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        Strategy: ROLLING
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      TaskDefinition:
        Fn::If:
        - HasWorkerRelease
        - Ref: WorkerTaskDefinitionArn
        - Ref: WorkerBootstrapTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: {Ref: PublicSubnetIds}
          SecurityGroups:
          - Ref: ApplicationSecurityGroupId
      EnableECSManagedTags: true
      PropagateTags: SERVICE
  SchedulerDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: {Ref: ProjectName}
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-scheduler
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - ScheduleGroup
                - Arn
      Policies:
      - PolicyName: ScopedAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ecs:RunTask
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-scheduler-release:*
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::GetAtt:
                  - Cluster
                  - Arn
          - Effect: Allow
            Action:
            - iam:PassRole
            Resource:
            - Fn::GetAtt:
              - AppExecutionRole
              - Arn
            - Fn::GetAtt:
              - WorkerTaskRole
              - Arn
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Effect: Allow
            Action:
            - sqs:SendMessage
            Resource:
              Fn::GetAtt:
              - SchedulerDlq
              - Arn
  Schedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: {Ref: ScheduleGroup}
      State: {Ref: SchedulerState}
      ScheduleExpression: {Ref: ScheduleExpression}
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::GetAtt:
          - Cluster
          - Arn
        RoleArn:
          Fn::GetAtt:
          - SchedulerRole
          - Arn
        EcsParameters:
          TaskDefinitionArn:
            Fn::If:
            - HasSchedulerRelease
            - Ref: SchedulerTaskDefinitionArn
            - Ref: SchedulerBootstrapTaskDefinition
          TaskCount: 1
          LaunchType: FARGATE
          PlatformVersion: 1.4.0
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              Subnets: {Ref: PublicSubnetIds}
              SecurityGroups:
              - Ref: ApplicationSecurityGroupId
        RetryPolicy:
          MaximumEventAgeInSeconds: 60
          MaximumRetryAttempts: 0
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - SchedulerDlq
            - Arn
  SchedulerFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-scheduler-failure'
      Description: Notify on Wiki batch task start failures or nonzero exits.
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt Cluster.Arn]
          lastStatus: [STOPPED]
          taskDefinitionArn:
          - prefix: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-scheduler-release:'
          '$or':
          - stopCode: [TaskFailedToStart]
          - containers:
              exitCode:
              - anything-but: 0
      Targets:
      - Id: NotifyOperator
        Arn: {Ref: AlarmTopic}
        InputTransformer:
          InputPathsMap:
            task: $.detail.taskArn
          InputTemplate: '"Wiki batch failed; inspect ECS task <task> and scheduler logs."'
  SchedulerFailureTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [{Ref: AlarmTopic}]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: cloudwatch.amazonaws.com}
          Action: sns:Publish
          Resource: {Ref: AlarmTopic}
          Condition:
            StringEquals:
              aws:SourceAccount: {Ref: AWS::AccountId}
            ArnLike:
              aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-*'
        - Effect: Allow
          Principal: {Service: events.amazonaws.com}
          Action: sns:Publish
          Resource: {Ref: AlarmTopic}
  WorkQueueDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-work-dlq'
      AlarmDescription: Jobs exhausted their SQS receive attempts; inspect before replaying.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value: !Select [5, !Split [':', !Ref DeadLetterQueueArn]]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{Ref: AlarmTopic}]
  SchedulerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-scheduler-dlq'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - SchedulerDlq
          - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS; test listener only from lifecycle hook
      VpcId: {Ref: VpcId}
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: {Ref: ApiPort}
        ToPort: {Ref: ApiPort}
        CidrIp: 127.0.0.1/32
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API from ALB only; HTTPS egress for AWS and external APIs
      VpcId: {Ref: VpcId}
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: {Ref: ApiPort}
        ToPort: {Ref: ApiPort}
        SourceSecurityGroupId: {Ref: AlbSecurityGroup}
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        DestinationSecurityGroupId: {Ref: DatabaseSecurityGroupId}
      - IpProtocol: tcp
        FromPort: 6379
        ToPort: 6380
        DestinationSecurityGroupId: {Ref: CacheSecurityGroupId}
  MigrationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Migration has no inbound listeners
      VpcId: {Ref: VpcId}
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        DestinationSecurityGroupId: {Ref: DatabaseSecurityGroupId}
  HookSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private lifecycle Lambda can reach ALB test listener only
      VpcId: {Ref: VpcId}
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 8443
        ToPort: 8443
        DestinationSecurityGroupId: {Ref: AlbSecurityGroup}
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 endpoint for lifecycle hook ALB private address discovery
      VpcId: {Ref: VpcId}
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        SourceSecurityGroupId: {Ref: HookSecurityGroup}
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 1
        ToPort: 1
        CidrIp: 127.0.0.1/32
  Ec2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: {Ref: VpcId}
      VpcEndpointType: Interface
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.ec2
      PrivateDnsEnabled: true
      SubnetIds: {Ref: PrivateSubnetIds}
      SecurityGroupIds:
      - Ref: EndpointSecurityGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: '*'
          Action: ec2:DescribeNetworkInterfaces
          Resource: '*'
          Condition:
            ArnEquals:
              aws:PrincipalArn:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-hook-execution
  TestListenerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: AlbSecurityGroup}
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      SourceSecurityGroupId: {Ref: HookSecurityGroup}
  AlbApiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: {Ref: AlbSecurityGroup}
      IpProtocol: tcp
      FromPort: {Ref: ApiPort}
      ToPort: {Ref: ApiPort}
      DestinationSecurityGroupId: {Ref: ApiSecurityGroup}
  ApiDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: DatabaseSecurityGroupId}
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: {Ref: ApiSecurityGroup}
  MigrationDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: DatabaseSecurityGroupId}
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: {Ref: MigrationSecurityGroup}
  ApiCacheIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: CacheSecurityGroupId}
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6380
      SourceSecurityGroupId: {Ref: ApiSecurityGroup}
  HookEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: {Ref: HookSecurityGroup}
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: {Ref: EndpointSecurityGroup}
