  ProductionListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: LoadBalancer}
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - CertificateArn:
          Fn::If:
          - CreateCertificate
          - Ref: Certificate
          - Ref: CertificateArn
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig:
          StatusCode: '403'
          ContentType: text/plain
          MessageBody: Forbidden
  ProductionRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: {Ref: ProductionListener}
      Priority: 10
      Conditions:
      - Field: host-header
        HostHeaderConfig:
          Values:
          - Ref: ApiDomainName
      Actions:
      - Type: forward
        ForwardConfig:
          TargetGroups:
          - TargetGroupArn:
              Ref: BlueTargetGroup
            Weight:
              Fn::If:
              - ProductionBlue
              - 1
              - 0
          - TargetGroupArn:
              Ref: GreenTargetGroup
            Weight:
              Fn::If:
              - ProductionBlue
              - 0
              - 1
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: LoadBalancer}
      Port: 8443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - CertificateArn:
          Fn::If:
          - CreateCertificate
          - Ref: Certificate
          - Ref: CertificateArn
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig:
          StatusCode: '403'
          ContentType: text/plain
          MessageBody: Forbidden
  TestRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: {Ref: TestListener}
      Priority: 10
      Conditions:
      - Field: host-header
        HostHeaderConfig:
          Values:
          - Ref: ApiDomainName
      Actions:
      - Type: forward
        ForwardConfig:
          TargetGroups:
          - TargetGroupArn:
              Ref: BlueTargetGroup
            Weight:
              Fn::If:
              - TestBlue
              - 1
              - 0
          - TargetGroupArn:
              Ref: GreenTargetGroup
            Weight:
              Fn::If:
              - TestBlue
              - 0
              - 1
  AlbInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-alb-infrastructure
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs.amazonaws.com
          Action: sts:AssumeRole
      Policies:
