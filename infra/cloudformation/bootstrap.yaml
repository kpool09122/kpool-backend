AWSTemplateFormatVersion: '2010-09-09'
Description: Administrator-owned IAM bootstrap; GitHub can deploy applications only.
Parameters:
  ProjectName:
    Type: String
    Default: kpool-production
    AllowedPattern: '[a-z][a-z0-9-]{2,23}'
  GitHubRepository:
    Type: String
    Default: kpool09122/kpool-backend
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  GitHubEnvironment:
    Type: String
    Default: production
    AllowedPattern: '[A-Za-z0-9_-]+'
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|arn:aws:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com
  HookArtifactObjectArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|arn:aws:s3:::[a-z0-9.-]+/.+
    Description: Exact S3 object ARN of the separately supplied hook ZIP, not a bucket ARN.
  CertificateHostedZoneId:
    Type: String
    Default: ''
    AllowedPattern: ^$|Z[A-Z0-9]+
    Description: Optional Route53 zone for ACM DNS validation; match runtime HostedZoneId.
  FoundationStackName:
    Type: String
    Description: Root stack name used for generated nested resources.
    AllowedPattern: '[a-z][a-z0-9-]{2,19}'
  FoundationTemplateBucketName:
    Type: String
    Description: Existing packaging bucket; read-only nested templates.
  FoundationWorkQueueName:
    Type: String
    Description: Foundation WorkQueueName physical name, including version.
Rules:
  TokyoOnly:
    Assertions:
    - Assert:
        Fn::Equals:
        - Ref: AWS::Region
        - ap-northeast-1
      AssertDescription: Deploy in ap-northeast-1 only.
Conditions:
  CreateOidcProvider:
    Fn::Equals:
    - Ref: ExistingOidcProviderArn
    - ''
  HasHookArtifact:
    Fn::Not:
    - Fn::Equals:
      - Ref: HookArtifactObjectArn
      - ''
  HasCertificateHostedZone:
    Fn::Not:
    - Fn::Equals:
      - Ref: CertificateHostedZoneId
      - ''
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
      - sts.amazonaws.com
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-github-deployment
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated:
              Fn::If:
              - CreateOidcProvider
              - Ref: GitHubOidcProvider
              - Ref: ExistingOidcProviderArn
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
              token.actions.githubusercontent.com:sub:
                Fn::Sub: repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
      - PolicyName: ApplicationReleaseOnly
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: RegistryAuthentication
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: PushProjectImage
            Effect: Allow
            Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:PutImage
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            - ecr:DescribeImages
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}
          - Sid: ReleaseDefinitions
            Effect: Allow
            Action:
            - ecs:RegisterTaskDefinition
            - ecs:TagResource
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-api-release:*
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-worker-release:*
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-migration-release:*
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-scheduler-release:*
          - Sid: ReadDefinition
            Effect: Allow
            Action: ecs:DescribeTaskDefinition
            Resource: '*'
          - Sid: DeployServices
            Effect: Allow
            Action:
            - ecs:UpdateService
            - ecs:DescribeServices
            - ecs:ListServiceDeployments
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}/${ProjectName}-api
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}/${ProjectName}-worker
          - Sid: ObserveDeployment
            Effect: Allow
            Action:
            - ecs:DescribeServiceDeployments
            - ecs:DescribeServiceRevisions
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}/${ProjectName}-api
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}/${ProjectName}-worker
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-deployment/${ProjectName}/${ProjectName}-api/*
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-deployment/${ProjectName}/${ProjectName}-worker/*
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-revision/${ProjectName}/${ProjectName}-api/*
            - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-revision/${ProjectName}/${ProjectName}-worker/*
          - Sid: RunMigration
            Effect: Allow
            Action: ecs:RunTask
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-migration-release:*
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ProjectName}
          - Sid: ObserveTasks
            Effect: Allow
            Action: ecs:DescribeTasks
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ProjectName}/*
          - Sid: ReadOutputs
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-*/*
            - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${FoundationStackName}/*
          - Sid: PassApplicationRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-api-task
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-worker-task
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-migration-task
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-app-execution
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-migration-execution
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-cloudformation-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudformation.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Ref: FoundationRegionalPolicy
      - Ref: FoundationNamedPolicy
      - Ref: FoundationGlobalPolicy
  FoundationRegionalPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Administrator-owned CloudFormation regional resource permissions.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Fn::If:
          - HasHookArtifact
          - Sid: ReadHookArtifact
            Effect: Allow
            Action:
            - s3:GetObject
            - s3:GetObjectVersion
            Resource:
              Ref: HookArtifactObjectArn
          - Ref: AWS::NoValue
        - Fn::If:
          - HasCertificateHostedZone
          - Sid: CertificateDnsValidation
            Effect: Allow
            Action:
            - route53:ChangeResourceRecordSets
            - route53:ListResourceRecordSets
            - route53:GetHostedZone
            Resource:
              Fn::Sub: arn:${AWS::Partition}:route53:::hostedzone/${CertificateHostedZoneId}
          - Ref: AWS::NoValue
        - Fn::If:
          - HasCertificateHostedZone
          - Sid: ObserveCertificateDnsChange
            Effect: Allow
            Action: route53:GetChange
            Resource:
              Fn::Sub: arn:${AWS::Partition}:route53:::change/*
          - Ref: AWS::NoValue
        - Sid: RegionalFoundation
          Effect: Allow
          Action:
          - ec2:CreateVpc
          - ec2:DeleteVpc
          - ec2:ModifyVpcAttribute
          - ec2:CreateSubnet
          - ec2:DeleteSubnet
          - ec2:ModifySubnetAttribute
          - ec2:CreateInternetGateway
          - ec2:DeleteInternetGateway
          - ec2:AttachInternetGateway
          - ec2:DetachInternetGateway
          - ec2:CreateRouteTable
          - ec2:DeleteRouteTable
          - ec2:AssociateRouteTable
          - ec2:DisassociateRouteTable
          - ec2:ReplaceRouteTableAssociation
          - ec2:CreateRoute
          - ec2:ReplaceRoute
          - ec2:DeleteRoute
          - ec2:CreateSecurityGroup
          - ec2:DeleteSecurityGroup
          - ec2:AuthorizeSecurityGroupIngress
          - ec2:RevokeSecurityGroupIngress
          - ec2:AuthorizeSecurityGroupEgress
          - ec2:RevokeSecurityGroupEgress
          - ec2:CreateTags
          - ec2:DeleteTags
          - ec2:CreateVpcEndpoint
          - ec2:ModifyVpcEndpoint
          - ec2:DeleteVpcEndpoints
          - ec2:Describe*
          - elasticloadbalancing:CreateLoadBalancer
          - elasticloadbalancing:DeleteLoadBalancer
          - elasticloadbalancing:ModifyLoadBalancerAttributes
          - elasticloadbalancing:SetSecurityGroups
          - elasticloadbalancing:SetSubnets
          - elasticloadbalancing:CreateTargetGroup
          - elasticloadbalancing:DeleteTargetGroup
          - elasticloadbalancing:ModifyTargetGroup
          - elasticloadbalancing:ModifyTargetGroupAttributes
          - elasticloadbalancing:CreateListener
          - elasticloadbalancing:DeleteListener
          - elasticloadbalancing:ModifyListener
          - elasticloadbalancing:CreateRule
          - elasticloadbalancing:DeleteRule
          - elasticloadbalancing:ModifyRule
          - elasticloadbalancing:SetRulePriorities
          - elasticloadbalancing:AddTags
          - elasticloadbalancing:RemoveTags
          - elasticloadbalancing:Describe*
          - acm:RequestCertificate
          - acm:DeleteCertificate
          - acm:DescribeCertificate
          - acm:AddTagsToCertificate
          - acm:RemoveTagsFromCertificate
          - acm:ListTagsForCertificate
          - ecs:CreateCluster
          - ecs:DeleteCluster
          - ecs:UpdateCluster
          - ecs:UpdateClusterSettings
          - ecs:PutClusterCapacityProviders
          - ecs:CreateService
          - ecs:UpdateService
          - ecs:DeleteService
          - ecs:RegisterTaskDefinition
          - ecs:DeregisterTaskDefinition
          - ecs:DescribeClusters
          - ecs:DescribeServices
          - ecs:DescribeTaskDefinition
          - ecs:TagResource
          - ecs:UntagResource
          - ecs:ListTagsForResource
          - rds:CreateDBInstance
          - rds:ModifyDBInstance
          - rds:DeleteDBInstance
          - rds:CreateDBSnapshot
          - rds:CreateDBSubnetGroup
          - rds:ModifyDBSubnetGroup
          - rds:DeleteDBSubnetGroup
          - rds:CreateDBParameterGroup
          - rds:ModifyDBParameterGroup
          - rds:DeleteDBParameterGroup
          - rds:Describe*
          - rds:AddTagsToResource
          - rds:RemoveTagsFromResource
          - rds:ListTagsForResource
          - elasticache:CreateServerlessCache
          - elasticache:ModifyServerlessCache
          - elasticache:DeleteServerlessCache
          - elasticache:DescribeServerlessCaches
          - elasticache:CreateServerlessCacheSnapshot
          - elasticache:AddTagsToResource
          - elasticache:RemoveTagsFromResource
          - elasticache:ListTagsForResource
          - elasticache:CreateUser
          - elasticache:ModifyUser
          - elasticache:DeleteUser
          - elasticache:DescribeUsers
          - elasticache:CreateUserGroup
          - elasticache:ModifyUserGroup
          - elasticache:DeleteUserGroup
          - elasticache:DescribeUserGroups
          Resource: '*'
          Condition:
            StringEquals:
              aws:RequestedRegion: ap-northeast-1
        - Sid: ManageNestedFoundation
          Effect: Allow
          Action:
          - cloudformation:CreateStack
          - cloudformation:UpdateStack
          - cloudformation:DeleteStack
          - cloudformation:DescribeStacks
          - cloudformation:DescribeStackEvents
          - cloudformation:GetTemplate
          - cloudformation:GetStackPolicy
          - cloudformation:SetStackPolicy
          - cloudformation:ListStackResources
          Resource:
            Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${FoundationStackName}-*/*
        - Sid: ReadPackagedFoundation
          Effect: Allow
          Action:
          - s3:GetObject
          - s3:GetObjectVersion
          Resource:
            Fn::Sub: arn:${AWS::Partition}:s3:::${FoundationTemplateBucketName}/*
  FoundationNamedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Administrator-owned CloudFormation named resource permissions.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: NamedRegionalResources
          Effect: Allow
          Action:
          - ecr:CreateRepository
          - ecr:DeleteRepository
          - ecr:DescribeRepositories
          - ecr:PutLifecyclePolicy
          - ecr:GetLifecyclePolicy
          - ecr:DeleteLifecyclePolicy
          - ecr:PutImageScanningConfiguration
          - ecr:PutImageTagMutability
          - ecr:TagResource
          - ecr:UntagResource
          - ecr:ListTagsForResource
          - sqs:CreateQueue
          - sqs:DeleteQueue
          - sqs:SetQueueAttributes
          - sqs:GetQueueAttributes
          - sqs:GetQueueUrl
          - sqs:TagQueue
          - sqs:UntagQueue
          - sqs:ListQueueTags
          - secretsmanager:CreateSecret
          - secretsmanager:UpdateSecret
          - secretsmanager:DeleteSecret
          - secretsmanager:DescribeSecret
          - secretsmanager:GetResourcePolicy
          - secretsmanager:TagResource
          - secretsmanager:UntagResource
          - ssm:PutParameter
          - ssm:DeleteParameter
          - ssm:GetParameter
          - ssm:AddTagsToResource
          - ssm:RemoveTagsFromResource
          - ssm:ListTagsForResource
          - logs:CreateLogGroup
          - logs:DeleteLogGroup
          - logs:PutRetentionPolicy
          - logs:DeleteRetentionPolicy
          - logs:TagResource
          - logs:UntagResource
          - logs:ListTagsForResource
          - cloudwatch:PutMetricAlarm
          - cloudwatch:DeleteAlarms
          - cloudwatch:DescribeAlarms
          - cloudwatch:TagResource
          - cloudwatch:UntagResource
          - cloudwatch:ListTagsForResource
          - sns:CreateTopic
          - sns:DeleteTopic
          - sns:SetTopicAttributes
          - sns:GetTopicAttributes
          - sns:Subscribe
          - sns:Unsubscribe
          - sns:GetSubscriptionAttributes
          - sns:SetSubscriptionAttributes
          - sns:TagResource
          - sns:UntagResource
          - sns:ListTagsForResource
          - scheduler:CreateSchedule
          - scheduler:UpdateSchedule
          - scheduler:DeleteSchedule
          - scheduler:GetSchedule
          - scheduler:CreateScheduleGroup
          - scheduler:DeleteScheduleGroup
          - scheduler:GetScheduleGroup
          - scheduler:TagResource
          - scheduler:UntagResource
          - scheduler:ListTagsForResource
          - lambda:CreateFunction
          - lambda:DeleteFunction
          - lambda:UpdateFunctionCode
          - lambda:UpdateFunctionConfiguration
          - lambda:GetFunction
          - lambda:GetFunctionConfiguration
          - lambda:TagResource
          - lambda:UntagResource
          - lambda:ListTags
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}
          - Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*
          - Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*
          - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/kpool/${ProjectName}/*
          - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/${ProjectName}-postgres/*
          - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*
          - Fn::Sub: arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-*
          - Fn::Sub: arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*
          - Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ProjectName}/*
          - Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${ProjectName}
          - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*
          - Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${FoundationWorkQueueName}
          - Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${FoundationStackName}-*
          - Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${FoundationStackName}-*
          - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/${FoundationStackName}-*/*
        - Sid: DescribeLogsAndGenerateRdsCredentials
          Effect: Allow
          Action:
          - logs:DescribeLogGroups
          - secretsmanager:GetRandomPassword
          Resource: '*'
        - Sid: RdsManagedSecret
          Effect: Allow
          Action:
          - secretsmanager:CreateSecret
          - secretsmanager:TagResource
          - secretsmanager:RotateSecret
          Resource:
            Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*
        - Sid: DescribeAwsManagedEncryptionKey
          Effect: Allow
          Action: kms:DescribeKey
          Resource:
            Fn::Sub: arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
        - Sid: ResolveFoundationCachePassword
          Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${FoundationStackName}-*
  FoundationGlobalPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Administrator-owned CloudFormation global resource permissions.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: Buckets
          Effect: Allow
          Action:
          - s3:CreateBucket
          - s3:DeleteBucket
          - s3:GetBucketLocation
          - s3:GetBucketPolicy
          - s3:PutBucketPolicy
          - s3:DeleteBucketPolicy
          - s3:GetBucketPublicAccessBlock
          - s3:PutBucketPublicAccessBlock
          - s3:GetEncryptionConfiguration
          - s3:PutEncryptionConfiguration
          - s3:GetBucketVersioning
          - s3:PutBucketVersioning
          - s3:GetLifecycleConfiguration
          - s3:PutLifecycleConfiguration
          - s3:GetBucketOwnershipControls
          - s3:PutBucketOwnershipControls
          - s3:GetBucketTagging
          - s3:PutBucketTagging
          Resource:
            Fn::Sub: arn:${AWS::Partition}:s3:::${FoundationStackName}-*
        - Sid: GlobalDeliveryAndBudget
          Effect: Allow
          Action:
          - cloudfront:CreateDistribution
          - cloudfront:UpdateDistribution
          - cloudfront:DeleteDistribution
          - cloudfront:GetDistribution
          - cloudfront:GetDistributionConfig
          - cloudfront:TagResource
          - cloudfront:UntagResource
          - cloudfront:ListTagsForResource
          - cloudfront:CreateOriginAccessControl
          - cloudfront:UpdateOriginAccessControl
          - cloudfront:DeleteOriginAccessControl
          - cloudfront:GetOriginAccessControl
          - cloudfront:ListOriginAccessControls
          - budgets:ViewBudget
          - budgets:ModifyBudget
          Resource: '*'
        - Sid: RuntimeRolesOnly
          Effect: Allow
          Action:
          - iam:CreateRole
          - iam:DeleteRole
          - iam:GetRole
          - iam:UpdateRole
          - iam:UpdateAssumeRolePolicy
          - iam:PutRolePolicy
          - iam:DeleteRolePolicy
          - iam:GetRolePolicy
          - iam:ListRolePolicies
          - iam:ListAttachedRolePolicies
          - iam:TagRole
          - iam:UntagRole
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-api-task
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-worker-task
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-migration-task
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-app-execution
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-migration-execution
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-alb-infrastructure
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-hook-invocation
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-hook-execution
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-scheduler
        - Sid: PassRuntimeRoles
          Effect: Allow
          Action: iam:PassRole
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-api-task
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-worker-task
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-migration-task
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-app-execution
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-migration-execution
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-alb-infrastructure
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-hook-invocation
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-hook-execution
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-scheduler
          Condition:
            StringEquals:
              iam:PassedToService:
              - ecs-tasks.amazonaws.com
              - ecs.amazonaws.com
              - lambda.amazonaws.com
              - scheduler.amazonaws.com
        - Sid: RequiredServiceLinkedRoles
          Effect: Allow
          Action: iam:CreateServiceLinkedRole
          Resource:
            Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*
          Condition:
            StringEquals:
              iam:AWSServiceName:
              - ecs.amazonaws.com
              - elasticloadbalancing.amazonaws.com
              - rds.amazonaws.com
              - elasticache.amazonaws.com
Outputs:
  DeploymentRoleArn:
    Value:
      Fn::GetAtt:
      - DeploymentRole
      - Arn
  CloudFormationExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - CloudFormationExecutionRole
      - Arn
  OidcProviderArn:
    Value:
      Fn::If:
      - CreateOidcProvider
      - Ref: GitHubOidcProvider
      - Ref: ExistingOidcProviderArn
